# A survey record (SPEC.md, section 4.6) over a CLOSED corpus: the
# searched universe is the claim's universe and the probes are complete
# over it, so absence is conclusive and `limitations` is correctly absent
# (there are no coverage bounds to state; ERF-4.30). A real record from a
# working corpus: the probes measure the corpus's own retired `granted`
# field, so the format's subtraction ledger cites a record instead of
# asserting a measurement in prose.
type: survey
id: granted-flag-uses-2026-08-22
corpus: knowledge-work-governance
title: >-
  Current uses of the granted field across the seven registered corpora
conducted: {timestamp: 2026-08-22, by: "agent/claude-fable-5"}
searches:
  - tool: "grep -rnE (BSD grep, macOS)"
    query: "^granted:|^  granted:"
    scope: >-
      all *.md under the seven registered corpus [private claims dir]/ homes
      ([private registry]); 305 claim and question files
    hits_reported: "0"
  - tool: "grep -rn (BSD grep, macOS)"
    query: "granted (word-level, --include=*.md)"
    scope: "same seven [private claims dir]/ homes"
    hits_reported: "4 lines in 3 files; none a field use"
  - tool: "grep -l (BSD grep, macOS)"
    query: "granted"
    scope: "the eight registered atom registries ([private registry]); 741 atoms"
    hits_reported: "0 files"
notable_results:
  - what: "The claims-tree doc-class granted dimension"
    note: >-
      One internal corpus's _claims README documents a doc-class field
      `granted: true`; a render-layer dimension of that document class,
      and the word's nearest live relative, not a record field.
  - what: "A grant rationale surviving as prose"
    note: >-
      One internal-corpus claim's working notes carry a grant rationale
      in prose; the field itself no longer appears on any record.
  - what: "Ordinary English"
    note: >-
      One record uses the word in its everyday sense ("access granted");
      not a field.
body: |
  Current uses of the granted field across the seven registered corpora:
  zero. The key-position probe over all 305 claim and question files
  returns no hits; the word-level probe returns four lines in three
  files, each a documentation mention, a prose rationale, or ordinary
  English rather than a field use; the eight atom registries (741 atoms)
  contain the word nowhere. Anyone holding the corpus can re-run the
  three probes and falsify this record.
