# Atom id to captured copy (`ERF-4.9`, `ERF-6.12`).
#
# The mechanical check reads the capture, never the live web. Where a
# capture cannot ship, the entry says so explicitly rather than going
# silently absent (`ERF-4.4a`): a mapping is only checkable when it is
# complete, and a missing key is indistinguishable from an oversight.
#
# `path` is relative to this file. `status: shipped` means the copy is in
# this repository and the quote check runs. Any other status means the
# check cannot run here, and the viewer says so on every claim that leans
# on the atom.

