# The source list (`ERF-3`, `ERF-4`, `ERF-5`).
#
# One entry per work: its citation, its retrieval locator where a fetch
# happened, and its capture or the recorded reason none ships. Every atom
# names one of these ids, so a work quoted by three atoms is stated once
# and cannot drift into three disagreeing descriptions.
#
# The mechanical check reads the capture, never the live web. Where a
# capture cannot ship, the entry says so explicitly rather than going
# silently absent (`ERF-4`): a list is only checkable when it is complete,
# and a missing key is indistinguishable from an oversight.
#
# The four shipped captures carry no `licence`: they ship under the W3C
# Document License 2023, which has no SPDX identifier (SPDX lists only the
# three W3C *Software* licences, the newest being W3C-20150513, a different
# licence). `ERF-68` covers exactly this case: they ship as what they are,
# short excerpts, and where no identifier applies, prose alone is correct.
#
# That licence permits copying and distributing a W3C document, or portions
# of it, in any medium and for any purpose, provided the original link, the
# copyright notice, and the document's status accompany the copy. Each
# capture carries all three in its own header, which is where a reader
# checks them.

sources:
  hellyer-2018-citators:
    citation_text: "Hellyer, \"Evaluating Shepard's, KeyCite, and BCite for
      Case Validation Accuracy\", Law Library Journal 110:4 (2018) —
      peer-reviewed study, 357 citing relationships"
    capture:
      status: not-redistributable
      path: null
      reason: "Journal article. Freely readable at the publisher, but no
        licence grants redistribution of the text by a third party."

  ragas-faithfulness-docs:
    citation_text: "RAGAS documentation, \"Faithfulness\""
    fetched_url: https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/
    capture:
      status: licence-unverified
      path: null
      reason: "The project's code is Apache-2.0, but the documentation site
        carries no explicit content licence, so redistribution rights are
        unverified. Unverified is not permission."

  guru-verification-docs:
    citation_text: "Guru product documentation, \"What is Verification\""
    fetched_url: https://www.getguru.com/product/verification
    capture:
      status: not-redistributable
      path: null
      reason: "Vendor product documentation, all rights reserved."

  w3c-prov-dm-2013:
    citation_text: "W3C, \"PROV-DM: The PROV Data Model\", W3C
      Recommendation, 30 April 2013"
    fetched_url: http://www.w3.org/TR/2013/REC-prov-dm-20130430/
    capture:
      status: shipped-as-quotation
      path: captures/w3c-prov-dm-2013-entities-activities.txt
      excerpt: true
      licence_name: "W3C Document License 2023"

  w3c-prov-o-2013:
