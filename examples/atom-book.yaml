type: atom
id: kwg-117
finding: >-
  Pacioli's 1494 treatise states the double-entry rule explicitly: every
  ledger entry is made twice, once as a debit and once as a credit.
quote: >-
  All entries made in the ledger have to be double entries -- that is, if
  you make one creditor, you must make some one debtor.
citation_text: >-
  Luca Pacioli, Particularis de Computis et Scripturis (Venice, 1494),
  ch. 36, trans. Geijsbeek 1914
