<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERF</title>
<style>
/*STYLE*/
/* the app's own chrome, on top of the viewer's stylesheet */
/* Inline, the card is the answer: no chrome, sized to its content, the host scrolls.
   Fullscreen, the card is the app: the bar returns and #main scrolls on its own. */
html, body { margin: 0; }
body { display: flex; flex-direction: column; }
body.mode-fullscreen { height: 100vh; }
#head { display: flex; gap: .6rem; align-items: baseline; padding: .4rem .9rem 0; font-family: var(--sans); font-size: .8rem; opacity: .75; }
body.mode-fullscreen #head { position: sticky; top: 0; background: var(--paper); padding-bottom: .3rem; border-bottom: 1px solid var(--rulelt); opacity: 1; }
#head #crumb-inline { font-style: italic; }
#head #status-inline { margin-left: auto; font-variant-numeric: tabular-nums; }
#head #status-inline.working { color: var(--warn); }
#head #status-inline.settled { color: var(--good); }
#head button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .05rem .45rem; cursor: pointer; font: inherit; }
#main { padding: 0 .9rem 1rem; }
body.mode-fullscreen #main { flex: 1; overflow: auto; padding-bottom: calc(1rem + var(--safe-bottom, 0px)); }
#main[hidden] { display: none; }
#main main { max-width: none; }
/* a record inline is a card: the title at reading size, one line for what it is, one for how much sits under each heading */
#main main.compact h1 { font-size: 1.15rem; line-height: 1.35; margin: .3rem 0 .35rem; }
#main main.compact p { margin: .15rem 0; }
#main main.compact .tags.head { display: inline; }
#main main.compact .tags.head .t { font-size: .75rem; }
#main main.compact .finding { margin: .45rem 0; }
#main main.compact .hint { opacity: .7; }

/* the editor: shown only fullscreen, and it scrolls on its own */
/* the host's composer sits over the bottom edge in fullscreen: leave it a band the text never scrolls under */
#editor { flex: 1; min-height: 0; overflow: hidden; padding-bottom: var(--safe-bottom, 0px); box-sizing: border-box; }
#editor[hidden] { display: none; }
#editor .cm-editor { height: 100%; }

/* the file moved under an open editor: two ways out, both said aloud */
#banner { display: flex; gap: .5rem; align-items: baseline; padding: .35rem .9rem; font-family: var(--sans); font-size: .8rem;
  background: var(--warnbg); color: var(--warn); border-bottom: 1px solid var(--rule); }
#banner[hidden] { display: none; }
#banner span { margin-right: auto; }
#banner button { border: 1px solid var(--warn); background: transparent; color: var(--warn); border-radius: 4px; padding: .05rem .5rem; cursor: pointer; font: inherit; }

/* the research trail: one flag's work as it lands, folded under the head bar (fullscreen only; inline the card is an answer) */
#trail { padding: .3rem .9rem .5rem; font-family: var(--sans); font-size: .78rem; background: var(--codebg); border-bottom: 1px solid var(--rulelt); max-height: 40vh; overflow: auto; }
#trail[hidden] { display: none; }
/* inline the trail is the card's summary line, folded; it unfolds on demand and the host grows the card */
body.mode-inline #trail { max-height: none; }
#trail.folded #trail-body { display: none; }
#trail.folded { padding-bottom: .3rem; }
#trail-head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .2rem; }
#trail-head span { margin-right: auto; color: var(--muted); }
#trail-head button { border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 4px; padding: .05rem .5rem; cursor: pointer; font: inherit; }
#trail-head button[hidden] { display: none; }
/* the same ladder as the ruling card: a chevron for folded and summary, one control for every line */
#trail-head #trail-chev { border: 0; padding: 0; color: var(--muted); font-size: .7rem; line-height: 1; }
#trail-head #trail-chev:hover { color: var(--accent); }
#trail-head #trail-card { border: 0; padding: 0; color: var(--accent); text-decoration: underline dotted; }
#trail .line.count { color: var(--muted); }
#trail h4 { margin: .4rem 0 .15rem; font-size: .78rem; font-weight: 600; }
#trail .line { white-space: pre-wrap; margin: .05rem 0; }
#trail .line.search { color: var(--ink); }
#trail .line.capture { color: var(--good); }
#trail .line.refused { color: var(--warn); }
#trail .line.atom, #trail .line.claim { color: var(--accent); }
#trail .line.empty { color: var(--muted); font-style: italic; }
#trail a { color: inherit; }
#head #status-inline.trailable { cursor: pointer; text-decoration: underline dotted; }

/* a hand-wrapped file: one offer to make it CommonMark-style, taken or dismissed, never silent */
#notice { display: flex; gap: .5rem; align-items: baseline; padding: .35rem .9rem; font-family: var(--sans); font-size: .8rem;
  background: var(--codebg); color: var(--muted); border-bottom: 1px solid var(--rulelt); }
#notice[hidden] { display: none; }
#notice span { margin-right: auto; }
#notice button { border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 4px; padding: .05rem .5rem; cursor: pointer; font: inherit; }
#notice button#notice-go { border-color: var(--accent); color: var(--accent); }

/* the ruling card: proposals with their evidence, three visible actions each, one finish; the host's tokens where it sets them */
.props { font-family: var(--sans); font-size: .86rem; }
/* the head: an eyebrow, the flagged passage as the title in the reading face, the narrative's title as the deck */
.props .eyebrow { font-size: .72rem; color: var(--muted); letter-spacing: .02em; margin: .35rem 0 .45rem; }
.props .passage { font-family: var(--serif); font-size: 1.28rem; line-height: 1.38; color: var(--ink); margin: 0 0 .35rem; max-width: 34em; hanging-punctuation: first; }
.props .passage.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.props .showall { border: 0; background: transparent; color: var(--accent); padding: 0; margin: -.1rem 0 .35rem; cursor: pointer; font: inherit; font-size: .78rem; }
.props .deck { color: var(--muted); font-size: .82rem; margin: 0 0 1rem; }
/* Three states, so a conversation with several passes stays readable: folded is one line, summary is the claims,
   full opens every quote. Nothing here is sized and nothing scrolls inside the card, because inline the app reports
   its own height to the host and folding has to shrink it. */
.props .headrow { display: flex; align-items: baseline; gap: .4rem; margin: .35rem 0 .45rem; }
.props .chev { border: 0; background: transparent; color: var(--muted); padding: 0; cursor: pointer; font: inherit; font-size: .7rem; line-height: 1; }
.props .headrow .eyebrow { margin: 0; border: 0; background: transparent; color: var(--muted); padding: 0; cursor: pointer; font: inherit; font-size: .72rem; letter-spacing: .02em; text-align: left; }
.props .headrow .eyebrow:hover, .props .chev:hover { color: var(--accent); }
.props .headrow .allquotes { margin-left: auto; border: 1px solid var(--rulelt); background: transparent; color: var(--muted); border-radius: 4px; padding: .05rem .45rem; cursor: pointer; font: inherit; font-size: .74rem; }
.props .headrow .allquotes:hover { border-color: var(--accent); color: var(--accent); }
/* the folded card: the flagged passage in the reading face, clipped to the line, then the counts and the state word */
.props.folded { padding: 0; }
.props .foldline { display: flex; align-items: baseline; gap: .5rem; width: 100%; box-sizing: border-box; text-align: left;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink); padding: .45rem .1rem; cursor: pointer; font: inherit; }
.props .foldline:hover { background: var(--highlight); }
.props .foldline .fold-passage { flex: 1 1 auto; min-width: 0; font-family: var(--serif); font-size: 1rem; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.props .foldline .fold-counts, .props .foldline .fold-state { flex: 0 0 auto; font-size: .74rem; color: var(--muted); white-space: nowrap; }
.props .foldline .fold-state.ruled { color: var(--good); }
/* one proposal in summary: how much evidence it carries, and the disclosure that opens that proposal's quotes in place */
.props .evidence { display: flex; align-items: baseline; gap: .5rem; margin: .1rem 0; font-size: .76rem; color: var(--muted); }
.props .evidence .disclose { border: 1px solid var(--rulelt); background: transparent; color: var(--muted); border-radius: 4px; padding: .02rem .4rem; cursor: pointer; font: inherit; font-size: .74rem; }
.props .evidence .disclose:hover { border-color: var(--accent); color: var(--accent); }
/* one proposal: the title reads as text, the id and kind sit in the corner, the evidence follows as quotes */
.props .prop { position: relative; border: 1px solid var(--rulelt); border-radius: 6px; padding: .6rem .8rem .6rem; margin: 0 0 .8rem; background: var(--paper); }
.props .prop.ruled-accepted, .props .prop.ruled-narrowed { border-color: var(--good); }
.props .prop.ruled-dropped { opacity: .55; }
.props .corner { display: flex; gap: .4rem; align-items: baseline; justify-content: flex-end; font-size: .72rem; color: var(--muted); margin-bottom: .1rem; }
/* the corner is a row of its own above the title: an absolute corner ran under long ids (2026-08-27) */
.props .prop > .corner { margin: 0 0 .3rem; }
.props .corner .id, .props .corner .aid { font-family: var(--mono); opacity: .85; }
.props .corner .kind { text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.props .prop .title { margin: .25rem 0 .7rem; font-size: 1rem; line-height: 1.45; color: var(--ink); max-width: 72ch; }
.props .prop .hint { margin: -.15rem 0 .5rem; font-size: .76rem; color: var(--muted); }
.props .prop .was { margin: -.2rem 0 .35rem; font-size: .76rem; color: var(--muted); font-style: italic; }
.props .prop .title-edit { display: block; width: 100%; box-sizing: border-box; margin: .2rem 0 .35rem; padding: .35rem .45rem; border: 1px solid var(--accent); border-radius: 4px; background: var(--codebg); color: var(--ink); font: inherit; font-size: .95rem; line-height: 1.4; resize: vertical; }
.props .atom { margin: .4rem 0; padding: .35rem .55rem .3rem; border-left: 3px solid var(--good); background: var(--codebg); border-radius: 0 4px 4px 0; }
.props .atom.against { border-left-color: var(--warn); }
/* the side tag on the left, the atom id at the top right */
.props .atom .corner { justify-content: space-between; margin-bottom: .15rem; }
.props .atom .side { text-transform: uppercase; letter-spacing: .05em; }
.props .atom .side.against { color: var(--warn); }
.props .atom blockquote { margin: 0 0 .25rem; font-style: italic; color: var(--ink); line-height: 1.45; max-width: 72ch; }
.props .atom .finding { margin: 0 0 .2rem; font-size: .8rem; color: var(--muted); }
.props .atom .cite { margin: 0; font-size: .76rem; color: var(--muted); }
.props .atom .cite a { color: var(--accent); }
.props .atom .cite a.capture { opacity: .8; }
.props .atom .cite .faint { opacity: .7; }
.props .atom.missing { border-left-color: var(--warn); color: var(--warn); }
/* what would settle it, and the worker's note: labelled, smaller, fainter than the title and the quotes */
.props .meta { font-size: .78rem; color: var(--muted); margin: .45rem 0 0; line-height: 1.45; max-width: 72ch; }
.props .meta .label { display: block; font-size: .76rem; color: var(--muted); opacity: .9; margin-bottom: .05rem; }
.props .actions { display: flex; gap: .4rem; align-items: center; margin-top: .5rem; flex-wrap: wrap; }
.props .actions button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .22rem .6rem; cursor: pointer; font: inherit; }
.props .actions button:disabled { opacity: .45; cursor: default; }
.props .actions button.accept { border-color: var(--good); color: var(--good); }
.props .actions button.narrow { border-color: var(--accent); color: var(--accent); }
.props .actions button.drop { border-color: var(--warn); color: var(--warn); }
.props .actions .ruled { font-size: .8rem; color: var(--good); }
.props .actions .ruled.dropped { color: var(--muted); }
.props .foot { display: flex; gap: .6rem; align-items: baseline; margin-top: .6rem; padding-top: .5rem; border-top: 1px solid var(--rulelt); }
.props .foot .count { margin-right: auto; color: var(--muted); }
.props .foot button { border: 1px solid var(--accent); background: var(--codebg); color: var(--accent); border-radius: 4px; padding: .25rem .7rem; cursor: pointer; font: inherit; font-weight: 600; }
.props .foot button:disabled { opacity: .45; cursor: default; }
.props .done { color: var(--good); }
.props .err { color: var(--warn); font-size: .8rem; margin-top: .3rem; }
#main p.back { font-family: var(--sans); font-size: .8rem; margin: .2rem 0 .4rem; }
#selbar { position: fixed; z-index: 10; display: flex; gap: .4rem; padding: .3rem .4rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); box-shadow: 0 2px 10px rgba(0,0,0,.25); font-family: var(--sans); font-size: .85rem; }
#selbar[hidden] { display: none; }
mark.flag { background: transparent; color: inherit; border-bottom: 2px dashed var(--warn); padding: 0; }
ul.outline { list-style: none; padding-left: 0; }
ul.outline li { padding: .15rem 0; }
#selbar button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .2rem .55rem; cursor: pointer; }
#selbar button:hover { border-color: var(--accent); color: var(--accent); }

/* what the flag asks for, chosen at the selection and nowhere else */
#flagpop { position: fixed; z-index: 11; width: 22rem; max-width: calc(100vw - 1rem); padding: .55rem .65rem; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper); box-shadow: 0 3px 14px rgba(0,0,0,.28); font-family: var(--sans); font-size: .82rem; }
#flagpop[hidden] { display: none; }
#flagpop .quote { color: var(--muted); font-style: italic; margin-bottom: .45rem; max-height: 3.4em; overflow: hidden; }
#flagpop .choices { display: flex; flex-direction: column; gap: .15rem; margin-bottom: .45rem; }
#flagpop .choices label { display: flex; gap: .4rem; align-items: baseline; cursor: pointer; padding: .12rem .2rem; border-radius: 4px; }
#flagpop .choices label:hover { background: var(--highlight); }
#flagpop .choices em { font-style: normal; color: var(--muted); }
#flagpop input[type=text] { width: 100%; box-sizing: border-box; padding: .25rem .35rem; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--codebg); color: var(--ink); font: inherit; margin-bottom: .45rem; }
#flagpop .row { display: flex; gap: .4rem; justify-content: flex-end; }
#flagpop button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .2rem .6rem; cursor: pointer; font: inherit; }
#flagpop button#flag-go { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="head"><span id="crumb-inline"></span><span id="status-inline"></span><button id="refresh" title="Re-read this page from the corpus">↻</button><button id="mode-toggle" title="Fullscreen or back inline">open</button></div>
<div id="trail" hidden><div id="trail-head"><button id="trail-chev" title="Fold the trail to one line">▾</button><span id="trail-title">the research trail</span><button id="trail-card" hidden title="Where the pass ended up">the card</button><button id="trail-all" title="Every search, capture, atom and claim">all lines</button></div><div id="trail-body"></div></div>
<div id="banner" hidden><span id="banner-text"></span><button id="banner-reload">reload</button><button id="banner-force">overwrite</button></div>
<div id="notice" hidden><span id="notice-text"></span><button id="notice-dismiss">leave it</button><button id="notice-go">Unwrap</button></div>
<div id="selbar" hidden><button id="flag-this" title="Flag this span, and say what should happen to it">Flag</button><button id="survey-this" title="What is known about this? Research first, then the claims it supports: the request goes into the conversation">Survey</button><button id="back-this" title="Claims first, then the evidence, then bind: the request goes into the conversation">Back</button></div>
<div id="flagpop" hidden>
  <div class="quote" id="flag-quote"></div>
  <div class="choices">
    <label><input type="radio" name="research" value="mint" checked><span>What does this claim? <em>propose the claims, stop for my ruling</em></span></label>
    <label><input type="radio" name="research" value="survey"><span>Survey it <em>what is known about this, before I decide what to claim</em></span></label>
    <label><input type="radio" name="research" value="back"><span>Back it <em>claims first, then the evidence, then bind</em></span></label>
    <label><input type="radio" name="research" value="opposite"><span>Oppose it <em>back it, and the strongest case against before I stand</em></span></label>
  </div>
  <input type="text" id="flag-note" placeholder="a note to self (optional)">
  <div class="row"><button id="flag-cancel">cancel</button><button id="flag-go">Flag</button></div>
</div>
<div id="main"><main><p class="gap">Waiting for a page…</p></main></div>
<div id="editor" hidden></div>
<script type="module">
/*SCRIPT*/
</script>
</body>
</html>
