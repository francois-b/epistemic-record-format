<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERF</title>
<style>
/*STYLE*/
/* the app's own chrome, on top of the viewer's stylesheet */
/* Inline, the card is the answer: no chrome, sized to its content, the host scrolls.
   Fullscreen, the card is the app: the bar returns and #main scrolls on its own. */
html, body { margin: 0; }
body { display: flex; flex-direction: column; }
body.mode-fullscreen { height: 100vh; }
#head { display: flex; gap: .6rem; align-items: baseline; padding: .4rem .9rem 0; font-family: var(--sans); font-size: .8rem; opacity: .75; }
body.mode-fullscreen #head { position: sticky; top: 0; background: var(--paper); padding-bottom: .3rem; border-bottom: 1px solid var(--rulelt); opacity: 1; }
#head #crumb-inline { font-style: italic; }
#head #status-inline { margin-left: auto; }
#head button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .05rem .45rem; cursor: pointer; font: inherit; }
#main { padding: 0 .9rem 1rem; }
body.mode-fullscreen #main { flex: 1; overflow: auto; }
#main main { max-width: none; }
#selbar { position: fixed; z-index: 10; display: flex; gap: .4rem; padding: .3rem .4rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); box-shadow: 0 2px 10px rgba(0,0,0,.25); font-family: var(--sans); font-size: .85rem; }
#selbar[hidden] { display: none; }
mark.flag { background: transparent; color: inherit; border-bottom: 2px dashed var(--warn); padding: 0; }
ul.outline { list-style: none; padding-left: 0; }
ul.outline li { padding: .15rem 0; }
#selbar button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .2rem .55rem; cursor: pointer; }
#selbar button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="head"><span id="crumb-inline"></span><span id="status-inline"></span><button id="refresh" title="Re-read this page from the corpus">↻</button><button id="mode-toggle" title="Fullscreen or back inline">open</button></div>
<div id="selbar" hidden><button id="back-this" title="Mark this passage to be backed: it is flagged in the corpus and the conversation is told; say “work the flags” when you want them proposed">Back this</button></div>
<div id="main"><main><p class="gap">Waiting for a page…</p></main></div>
<script type="module">
/*SCRIPT*/
</script>
</body>
</html>
