/*STYLE*/
/* the app's own chrome, on top of the viewer's stylesheet */
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; min-height: 320px; }
nav.appbar { display: flex; gap: 1rem; align-items: baseline; padding: .5rem .9rem; border-bottom: 1px solid rgba(127,127,127,.35); font-size: .9rem; position: sticky; top: 0; background: inherit; }
nav.appbar a { cursor: pointer; text-decoration: none; }
nav.appbar #crumb { margin-left: auto; opacity: .75; font-style: italic; }
nav.appbar #status { opacity: .6; }
#main { flex: 1; overflow: auto; padding: 0 .9rem 1rem; }
#main main { max-width: none; }
#selbar { position: fixed; z-index: 10; display: flex; gap: .4rem; padding: .3rem .4rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); box-shadow: 0 2px 10px rgba(0,0,0,.25); font-family: var(--sans); font-size: .85rem; }
#selbar button { border: 1px solid var(--rule); background: var(--codebg); color: var(--ink); border-radius: 4px; padding: .2rem .55rem; cursor: pointer; }
#selbar button:hover { border-color: var(--accent); color: var(--accent); }
</style>
