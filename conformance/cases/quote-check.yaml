# ERF-50 and ERF-52: the mechanical quote check.
#
# Each case gives a quote, a capture, and the expected verdict. The check
# splits the quote on `[...]` BEFORE normalizing, normalizes each span, and
# requires every non-empty span to occur in the normalized capture in order
# and without overlap.
#
# A failing case is a finding about the implementation. Do not edit an
# expectation to make a test pass.

cases:
  - name: a verbatim quote occurs in its capture
    requirement: ERF-50
    quote: "An entity is a physical, digital, conceptual, or other kind of thing."
    capture: "Preamble. An entity is a physical, digital, conceptual, or other kind of thing. More text follows."
    expect: pass

  - name: a quote the capture does not contain fails
    requirement: ERF-50
    quote: "the study found no effect"
    capture: "the study found a small positive effect in the treated group"
    expect: fail

  - name: an elision marker spans omitted material
    requirement: ERF-52
    quote: "The study found [...] no effect on retention."
    capture: "The study found, after controlling for tenure and role, no effect on retention."
    expect: pass

  - name: spans must occur in order
    requirement: ERF-52
    note: >
      Both spans are present in the capture but in the opposite order, so the
      quote misrepresents the source's sequence and must fail.
    quote: "no effect on retention [...] The study found"
    capture: "The study found, after controls, no effect on retention."
    expect: fail

  - name: spans must not overlap
    requirement: ERF-52
    note: >
      The second span can only be satisfied by re-reading text the first span
      already consumed, which would let one occurrence stand for two.
    quote: "the same words [...] the same words"
    capture: "prefix the same words suffix"
    expect: fail

  - name: a bare ellipsis is literal, not a wildcard
    requirement: ERF-52
    note: >
      Reserved for dots the source itself contains (ERF-6). Treating it as a
      wildcard let a quote pass against text the source never carried, which
      is the defect this case defends against.
    quote: "Wait... what?"
    capture: "Wait, despite the warning, what?"
    expect: fail

  - name: a bare ellipsis matches when the source really has one
    requirement: ERF-52
    quote: "Wait... what?"
    capture: "He paused. Wait... what? Then he continued."
    expect: pass

  - name: a quote of nothing but elisions fails rather than trivially passing
    requirement: ERF-52
    quote: "[...]"
    capture: "any capture at all"
    expect: fail

  - name: a quote passes only after normalization
    requirement: ERF-51
    note: >
      The capture italicises a word and wraps a line inside the quoted span.
      Both differences are ones the author did not introduce, which is what
      the three surviving steps are for.
    quote: "The reported total was 17 units."
    capture: "The *reported* total\n  was 17 units."
    expect: pass

  - name: a capture carrying markdown link syntax no longer passes
    requirement: ERF-51
    note: >
      Layout and markup repair left the normalization sequence on
      2026-08-25 and became a capture-time act under ERF-70. A capture still
      carrying link syntax inside the quoted span is a capture that was not
      cleaned, and the check says so rather than guessing.
    quote: "The reported total was 17."
    capture: "The [reported total](https://ex.test/data) was 17."
    expect: fail

  - name: a retyped curly apostrophe fails
    requirement: ERF-51
    note: >
      The sequence folds no typographic characters. An author who retypes
      rather than copies is guessing at their own evidence, and the failure
      tells them to copy from the capture. Measured over 160 atoms in three
      corpora, this newly failed four, and every one was a real
      transcription divergence the folding had concealed.
    quote: "that amount doesn't include leases"
    capture: "that amount doesn\u2019t include leases"
    expect: fail

  - name: a hyphen at a line break is not joined
    requirement: ERF-51
    note: >
      Undecidable without knowing the word: classifi-cation is one word,
      Pre-money is two, and no rule tells them apart. The producer resolves
      it at capture time; the checker does not guess.
    quote: "Premoney valuation"
    capture: "Pre-\nmoney valuation"
    expect: fail

  - name: case is not folded
    requirement: ERF-51
    note: >
      Folding case would let a mis-cased quote pass a check whose whole job
      is fidelity.
    quote: "the study found"
    capture: "The Study Found no effect"
    expect: fail

  - name: a missing capture is uncheckable, neither pass nor fail
    requirement: ERF-51
    quote: "anything"
    capture: null
    expect: uncheckable

  - name: an elided quote assembled from word fragments fails
    requirement: ERF-52
    note: >
      F-008, found by the Go trial. Split-before-normalize plus trim left
      plain substring containment, so "The cat" matched inside "The
      catapult" and "sat" matched "sat", in order, without overlap. Spans
      must occur as whole words.
    quote: "The cat[...]sat"
    capture: "The catapult was heavy. Someone eventually sat on the mat beside it."
    expect: fail

  - name: a fragment of a longer word fails even without an elision
    requirement: ERF-52
    note: the same fabrication without the marker; verbatim means whole words.
    quote: "cat"
    capture: "The catapult was heavy."
    expect: fail

  - name: a span opening on punctuation is unconstrained on that side
    requirement: ERF-52
    note: the punctuation is the boundary; a quote may begin mid-sentence at a quotation mark or bracket.
    quote: "(heavy) it was"
    capture: "The catapult (heavy) it was, and old."
    expect: pass

  - name: whole words on both sides of an elision still pass
    requirement: ERF-52
    quote: "The catapult[...]sat on the mat"
    capture: "The catapult was heavy. Someone eventually sat on the mat beside it."
    expect: pass
