# Which test defends which requirement.
#
# Three states, and the third is the point of the file:
#   tests:                 one or more cases assert this requirement
#   untestable-by-design:  it constrains authoring judgment no tool can reach
#   uncovered:             it should be tested and is not (a to-do, not a gap
#                          in the format)
#
# A requirement with neither tests nor a reason is a hole in this file, and
# the runner fails on one. ERF-16, ERF-29, ERF-30, ERF-45, ERF-46, and
# ERF-64 are retired and must not appear.

requirements:
  ERF-1:
    tests: [quote-check]
    note: the uncheckable case asserts a check never runs without a capture
  ERF-2:
    untestable-by-design: how a capture is made and dated is a producer practice, not a property of a loaded record
  ERF-3:
    tests: [fixtures/valid/minimal, fixtures/invalid/source-entries-at-top-level, schema]
    note: >
      the source list lives beside the corpus, never on the atom, and its
      top level is exactly `type` and `sources` (F-003). The invalid fixture
      writes the entries as further top-level keys, which is the reading an
      independent implementation took from the earlier wording, so the two
      readings cannot both pass.
  ERF-4:
    tests: [fixtures/invalid/atom-absent-from-mapping]
  ERF-5:
    tests: [fixtures/invalid/absence-without-reason, schema]
  ERF-72:
    tests: [fixtures/valid/extension-field, schema]
    note: an x_ field on a record loads with zero findings
  ERF-69:
    uncovered: no fixture asserts an excerpt capture declares itself, and whether an excerpt carries enough context is an authoring judgment
  ERF-70:
    tests: [fixtures/invalid/pdf-without-extraction]
    note: the tool-naming half; determinism itself is a property of the tool and untestable here
  ERF-71:
    uncovered: no fixture asserts an excerpt or converted capture records an immutable locator and a digest
  ERF-6:
    tests: [quote-check]
  ERF-7:
    tests: [fixtures/invalid/citation-text-carries-url, hygiene, schema]
  ERF-8:
    untestable-by-design: whether a rendered citation carries everything its structured form holds is a judgment about bibliographic completeness
  ERF-9:
    untestable-by-design: which of two inputs governs a source's grade is an assessment, not a computation
  ERF-10:
    untestable-by-design: whether a finding's subject is discourse itself is a reading of the finding
  ERF-11:
    tests: [fixtures/invalid/stored-mechanical-result]
  ERF-12:
    tests: [fixtures/invalid/parse-error-as-verdict, schema]
  ERF-13:
    tests: [schema]
    note: was untestable-by-design; the shape half is now in erf.schema.json and the gate holds it
  ERF-14:
    tests: [schema]
    note: was untestable-by-design; the shape half is now in erf.schema.json and the gate holds it
  ERF-15:
    tests: [fixtures/invalid/reference-encodes-location]
  ERF-17:
    tests: [fixtures/valid/minimal, schema]
    note: the loader requires corpus on every record
  ERF-18:
    untestable-by-design: that a title states the claim is the authoring act itself; the mechanical half was ERF-46, retired 2026-08-24 into this guidance
  ERF-19:
    tests: [fixtures/invalid/standing-bare-date, fixtures/invalid/standing-bare-date-block-style, schema]
    note: >
      timestamp precision is covered by the fixture; the append-only and
      non-empty-why halves are covered by ERF-39 and ERF-40
  ERF-20:
    untestable-by-design: a SHOULD on producer behaviour, and the field's absence is legal
  ERF-21:
    tests: [disposition, schema]
    note: covered mechanically by ERF-39; the prohibition on machine stances has no fixture
  ERF-22:
    tests: [fixtures/invalid/stored-state-field]
  ERF-23:
    untestable-by-design: modelling counter-evidence as a rival claim is a shape the format asks an author not to build
  ERF-24:
    untestable-by-design: whether atoms jointly entail a statement is the audit judgment itself
  ERF-25:
    untestable-by-design: whether a claim is a universal negative is a reading of the claim
  ERF-26:
    uncovered: no fixture asserts a search act naming a category rather than an instrument
  ERF-27:
    uncovered: no fixture asserts hits_reported rejects invented precision
  ERF-28:
    uncovered: no fixture covers survey immutability or the title stating what was sought
  ERF-31:
    tests: [output, fixtures/invalid/binding-without-bound-at,
            fixtures/valid/anchor-spans-a-line-wrap, fixtures/valid/anchor-with-escaped-quote,
            fixtures/valid/anchor-broken-by-an-edit, fixtures/valid/anchor-in-an-earlier-passage, fixtures/invalid/binding-empty-anchor, fixtures/invalid/binding-unterminated, fixtures/invalid/binding-names-an-atom, fixtures/valid/binding-after-a-code-span, fixtures/invalid/malformed-candidate-does-not-close-a-passage]
    note: >
      the binding grammar through the shared bindingRe, plus the recognition
      rule: a candidate that fails the grammar is reported rather than
      skipped, which is what stops a required part from making a binding
      invisible instead of invalid
  ERF-32:
    tests: [staleness]
    note: the indeterminate branch, the mixed-precision day, and both plain orders
  ERF-33:
    tests: [output]
  ERF-34:
    tests: [fixtures/invalid/narrative-created-is-a-bare-date]
    note: >
      the three frontmatter fields, typed in B-36. That a narrative is a
      document rather than a record remains a modelling rule with no runtime
      surface; its frontmatter is checkable and now checked.
  ERF-35:
    tests: [fixtures/invalid/prior-survey-dangling, fixtures/valid/evidence-at-stance-outlives-atom, fixtures/invalid/atoms-for-names-a-survey]
    note: >
      both halves. Every valid fixture is asserted free of dangling
      references; the invalid one breaks prior_survey, which asserts a
      current relationship. The valid pair carries an evidence_at_stance
      id the corpus no longer holds, and asserts the flag is raised while
      conformance holds.
  ERF-36:
    tests: [fixtures/invalid/duplicate-id-across-types]
  ERF-37:
    untestable-by-design: a producer obligation whose mechanism the format declines to specify
  ERF-38:
    tests: [fixtures/invalid/duplicate-id-across-types]
  ERF-39:
    tests: [fixtures/valid/minimal, schema]
  ERF-40:
    untestable-by-design: verified against substrate history, which a loaded corpus does not carry
  ERF-41:
    tests: [disposition, fixtures/invalid/standing-unknown-stance, fixtures/valid/standing-tie-at-one-instant]
  ERF-42:
    tests: [disposition, output]
  ERF-43:
    tests: [fixtures/invalid/self-edge, fixtures/invalid/assumes-cycle, fixtures/invalid/assumes-cycle-two-node,
            fixtures/invalid/closure-ends-in-argument-leaf, fixtures/valid/premise-less-argument-is-a-flag, fixtures/invalid/supports-cycle]
    note: >
      self-edges, both cycle shapes, and the flag boundary ruled in B-30: a
      closure ending in an argument leaf is a violation on the claim built
      on it, while the same premise-less argument standing alone is
      ERF-49's flag and conforms. The retired-leaf flag is computed by
      retiredPremises and has no fixture yet; it needs a standing to retire
      a leaf.
  ERF-44:
    tests: [fixtures/invalid/conflicts-stored-twice]
    note: >
      the storage half; that a consumer reads both directions is exercised
      through conflictsFor in the rendered output
  ERF-47:
    tests: [staleness]
  ERF-48:
    tests: [fixtures/invalid/last-modified-precedes-created]
    note: >
      the statically checkable half; that a stamp advances on each edit is a
      property of history a loaded corpus does not carry
  ERF-50:
    tests: [quote-check, output]
  ERF-51:
    tests: [normalization, quote-check, erf-cases-quote-check]
  ERF-52:
    tests: [quote-check, fixtures/invalid/quote-all-empty-spans, fixtures/invalid/quote-spans-out-of-order, erf-cases-quote-check]
    note: >
      the elision rules gained fixtures on 2026-08-25 by adoption from the
      independent trials; before that the cases file tested them and no
      corpus did, so a validator could pass every fixture while accepting a
      quote of nothing but elisions
  ERF-53:
    tests: [fixtures/valid/minimal]
    note: the fixture round-trips through frontmatter plus body
  ERF-54:
    tests: [fixtures/valid/minimal]
  ERF-55:
    tests: [fixtures/invalid/unknown-field-originated, hygiene,
            fixtures/valid/evidence-at-stance-faced-nothing, schema]
    note: >
      the omit rule governs lists only (B-51). The valid fixture carries one
      standing with evidence_at_stance present-and-empty and one with it
      absent, and asserts the two survive the load differently, because a
      loader that tidied the empty mapping away would pass a load-clean
      check while destroying the distinction.
  ERF-56:
    tests: [fixtures/valid/minimal]
    note: the fixture omits empty lists and loads complete
  ERF-57:
    tests: [serialization]
  ERF-58:
    tests: [disposition]
    note: every case uses the timestamp key
  ERF-59:
    tests: [fixtures/invalid/manifest-missing-field, schema]
  ERF-60:
    tests: [fixtures/invalid/unsupported-major-version, fixtures/valid/newer-minor-version-extends]
  ERF-61:
    tests: [schema]
    note: was untestable-by-design; the shape half is now in erf.schema.json and the gate holds it
  ERF-62:
    untestable-by-design: which store is authoritative is a deployment fact
  ERF-63:
    untestable-by-design: a permission, satisfiable by any substrate
  ERF-65:
    tests: [serialization, fixtures/invalid/as-of-date-unquoted-year]
    note: asserts a date-shaped scalar loads as a string, not a date object
  ERF-66:
    tests: [fixtures/invalid/frontmatter-duplicate-key, fixtures/invalid/frontmatter-anchor]
  ERF-67:
    tests: [fixtures/invalid/bom-file, fixtures/invalid/bom-and-crlf]
    note: >
      the byte-order-mark half; CommonMark defines a parse for any text, so
      no body can fail to be CommonMark, and encodings beyond the BOM are
      not yet probed
  ERF-68:
    uncovered: no fixture ships a capture without an SPDX identifier
  YAMLB-1:
    tests: [output, fixtures/invalid/binding-without-bound-at, fixtures/invalid/binding-empty-anchor,
            fixtures/invalid/binding-unterminated, fixtures/valid/binding-after-a-code-span,
            fixtures/valid/anchor-with-escaped-quote]
    note: >
      the HTML-comment spelling and its recognition; the passage and the
      anchor test stay with ERF-31.
