requirement: ERF-43
record: "erfx-i04-1c, erfx-i04-2c"
field: "edges[0].to (both records)"
reason: >
  erfx-i04-1c assumes erfx-i04-2c, and erfx-i04-2c assumes erfx-i04-1c:
  a two-node cycle on `assumes`. ERF-43 requires `assumes` (and
  `decomposes-into`) to admit no cycles, and also requires an
  argument's premise closure to terminate in non-argument leaves; here
  the closure never terminates at all, both members being `argument`
  kind, which is a distinct failure mode from the single-node self-edge
  case in i03 -- the two are easy to conflate under one cycle check
  that only tests length-1 cycles.
