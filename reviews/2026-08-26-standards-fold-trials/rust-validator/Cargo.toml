[package]
name = "erfval"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
icu_properties = { version = "2.3.0", features = ["compiled_data"] }
jsonschema = "0.51.0"
pulldown-cmark = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"
yaml-rust2 = "0.12.0"
