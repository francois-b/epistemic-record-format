    as_of_date: "2026-05-29"

  # ---- History ----

  - id: ell-146
    finding: "Highsmith's first-hand account states that the Agile Manifesto came out of a meeting of seventeen people at Snowbird on 11 to 13 February 2001, which dates the event the essay refers to as the start of Agile."
    quote: "On February 11-13, 2001, at The Lodge at Snowbird ski resort in the Wasatch mountains of Utah, seventeen people met to talk, ski, relax, and try to find common ground—and of course, to eat."
    source: agile-manifesto-history
    source_quality: high
    as_of_date: "2001"

  - id: ell-147
    finding: "Highsmith's first-hand account states that the participants convened out of a shared need for an alternative to documentation-driven, heavyweight software development processes, which gives a different motivating cause from the faster iteration the essay names."
    quote: "Representatives from Extreme Programming, SCRUM, DSDM, Adaptive Software Development, Crystal, Feature-Driven Development, Pragmatic Programming, and others sympathetic to the need for an alternative to documentation driven, heavyweight software development processes convened."
    source: agile-manifesto-history
    source_quality: high
    as_of_date: "2001"

  - id: ell-148
    finding: "Highsmith's first-hand account places the deeper theme of the meeting in a set of shared values about people and collaboration rather than in any property of the development cycle."
    quote: "a set of values based on trust and respect for each other and promoting organizational models based on people, collaboration, and building the types of organizational communities in which we would want to work"
    source: agile-manifesto-history
    source_quality: high
    as_of_date: "2001"

  - id: ell-149
    finding: "Fowler's definition of continuous integration makes automated verification constitutive of the practice: each integration is verified by an automated build including test, which is the mechanical primitive the essay says the discipline formed around."
    quote: "Each of these integrations is verified by an automated build (including test) to detect integration errors as quickly as possible."
    source: fowler-ci
    source_quality: high
    as_of_date: "2024-01-18"

  - id: ell-150
    finding: "Wikipedia's article on the Semantic Web quotes Berners-Lee and colleagues stating in 2006 that the idea remained largely unrealized, and reports that in 2013 about four million of roughly 250 million web domains carried Semantic Web markup."
    quote: "In 2006, Berners-Lee and colleagues stated that: \"This simple idea…remains largely unrealized\".[...] In 2013, more than four million Web domains (out of roughly 250 million total) contained Semantic Web markup."
    source: semantic-web-wikipedia
    source_quality: medium
    as_of_date: "2013"
    limitations: "An encyclopedia relaying a 2006 quotation and a 2013 count; the count's own source is not read here. The ellipsis inside the quoted sentence is a character the source itself contains and is matched literally under ERF-52; the elision marker between the two sentences removes a footnote reference link."

  - id: ell-151
    finding: "Wikipedia's article on Project Xanadu reports that Wired called it the longest-running vaporware story in the history of the computer industry, which is one instance of the repeated failure of general-purpose knowledge primitives the essay asserts."
    quote: "magazine published an article entitled \"The Curse of Xanadu\", calling Project Xanadu \"the longest-running [...] story in the history of the computer industry\"."
    source: xanadu-wikipedia
    source_quality: medium
    limitations: "An encyclopedia relaying a magazine's characterization; the elision removes a markdown link on the word vaporware."

  - id: ell-152
    finding: "Wikipedia's article on the Admiralty code states that it is a two-character notation assessing source reliability and confidence in the information, used by NATO members, which shows that source grading for intelligence work is a codified standard and not only a hand practice."
    quote: "The system comprises a two-character notation assessing the reliability of the source and the assessed level of confidence on the information."
    source: admiralty-code-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summary of a military standard; the standard document itself is not read here."

  - id: ell-153
    finding: "Wikipedia's article on the Admiralty code states that each descriptor is assessed in isolation so that a source's reliability does not influence the assessed accuracy of the report, which is a separation of axes the essay's own grading proposal does not discuss."
    quote: "Each descriptor is considered in isolation to ensure that the reliability of the source does not influence the assessed accuracy of the report."
    source: admiralty-code-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summary of a military standard."

  - id: ell-154
    finding: "Palantir's own documentation describes the Ontology as an operational layer that connects integrated datasets to their real-world counterparts, which corroborates the essay's characterization of it as a formal-side descendant working on operational data."
    quote: "The Palantir **Ontology** is an operational layer for the organization."
    source: palantir-ontology
    source_quality: medium
    limitations: "Vendor documentation about the vendor's own product; the essay's further claim that these ontologies are hand-built is not settled by this quote."

  - id: ell-155
    finding: "Palantir's own documentation states that the semantics of an organization are defined by mapping existing data sources into objects, properties and links in the Ontology, which is a manual modelling step and the nearest thing in the source to the essay's hand-built characterization."
    quote: "Defining the semantics of your organization happens by mapping existing datasources into **objects, properties, and links** in the Ontology."
    source: palantir-ontology
    source_quality: medium
    limitations: "Vendor documentation; the quote says the mapping happens and does not say who or what performs it, so it under-determines whether the work is done by hand."

  # ---- Degradation, governance, dictation, decay ----

  - id: ell-156
    finding: "Shumailov and colleagues report in Nature that indiscriminate use of model-generated content in training causes irreversible defects in the resulting models, with the tails of the original content distribution disappearing."
    quote: "We find that indiscriminate use of model-generated content in training causes irreversible defects in the resulting models, in which tails of the original content distribution disappear."
    source: nature-model-collapse
    source_quality: high
    as_of_date: "2024-07"

  - id: ell-157
    finding: "Shumailov and colleagues define model collapse as a degenerative process across generations of models in which each generation's output pollutes the next generation's training set, which locates the mechanism in training rather than in the reuse of text between calls."
    quote: "Model collapse is a degenerative process affecting generations of learned generative models, in which the data they generate end up polluting the training set of the next generation."
    source: nature-model-collapse
    source_quality: high
    as_of_date: "2024-07"
    limitations: "The mechanism reported is recursive training on model output. It is not evidence about the reuse of model-written prose inside a working corpus between inference calls, which is the essay's subject."

  - id: ell-158
    finding: "Microsoft states that Purview is used to manage the risks of AI usage and to implement protection and governance controls over it, which is a shipped governance product operating on the workspace the essay says the conversation omits."
    quote: "Use Microsoft Purview to mitigate and manage the risks associated with AI usage, and implement corresponding protection and governance controls."
    source: purview-ai
    source_quality: medium
    limitations: "Vendor documentation about the vendor's own product; the quoted sentence states purpose and not what the controls do."

  - id: ell-159
    finding: "NIST states that its AI Risk Management Framework is intended for voluntary use, to improve the ability to incorporate trustworthiness into the design, development, use and evaluation of AI products and systems, which is a public governance framework outside regulated-industry mandate."
    quote: "is intended for voluntary use and to improve the ability to incorporate trustworthiness considerations into the design, development, use, and evaluation of AI products, services, and systems."
    source: nist-ai-rmf
    source_quality: high

  - id: ell-160
    finding: "Computerworld reports that a new generation of dictation tools uses large language models to produce polished, edited text rather than the verbatim transcripts earlier dictation apps aimed at, which is the change the article credits for renewed interest in voice at work."
    quote: "Unlike previous generations of dictation apps that aimed to produce a verbatim transcript, newer tools rely on large language models (LLMs) to craft polished, edited text."
    source: computerworld-dictation
    source_quality: medium
    as_of_date: "2026"
    limitations: "Trade press describing a product category. The finding was rewritten on 2026-08-25 after a cross-vendor finding audit returned UNSUPPORTED against the original wording, which asserted facts (a named CTO, four named startups, a 2025 date) that the attached quote did not carry. ERF-48 stamps the edit; the audit on record ran after it."
    last_modified:
      timestamp: "2026-08-25"
      by: "anthropic/claude-opus-5"

  - id: ell-161
    finding: "Computerworld frames the state of AI dictation at work as an open question about whether the technology is yet good enough to reach common office use, which is weaker than the essay's assertion that speech-to-text became ubiquitous in 2026."
    quote: "The use of large language models has made it easier for dictation software to quickly deliver better results. Is that enough to push the technology into common use in the office?"
    source: computerworld-dictation
    source_quality: medium
    as_of_date: "2026"
    limitations: "A subheadline written to frame an article, so it is a rhetorical question rather than a measurement; it is evidence about how a trade publication reads the state of adoption, not about adoption itself."

  - id: ell-162
    finding: "ZoomInfo reports that B2B databases lose between 22.5 and 70 percent of their accuracy annually depending on data type and industry, attributing the lower aggregate to HubSpot benchmarks and the higher email-field figure to Landbase."
    quote: "B2B databases lose between 22.5% and 70% of their accuracy annually, depending on data type and industry."
    source: zoominfo-data-decay
    source_quality: medium
    as_of_date: "2026"
    limitations: "A data vendor publishing decay figures for the problem its own product sells against, relaying two other parties' benchmarks without their methods; the interest and the double relay both cut against the number."

  - id: ell-163
    finding: "ZoomInfo characterizes CRM decay as a continuous structural condition in which every unverified record accumulates as a liability, which locates the cause in the world changing rather than in the operator failing to maintain the record by hand."
    quote: "Every CRM record that goes unverified is a liability accumulating silently in your pipeline, misrouting leads, corrupting scoring models, and degrading the outreach that depends on it."
    source: zoominfo-data-decay
    source_quality: medium
    as_of_date: "2026"
    limitations: "A data vendor's framing of the problem its own product addresses."

  - id: ell-164
    finding: "Guru's help documentation states that verification is its system for marking content as trusted and current and that every piece of content carries one of three verification states, which is the whole-page verification the essay attributes to Guru's cards."
    quote: "Verification is a trust signal that tells users whether content has been reviewed and confirmed as accurate."
    source: guru-verification-help
    source_quality: high

  - id: ell-165
    finding: "Guru states that manual verification processes typically reach only 8 to 12 percent of an organization's content, leaving the rest to go out of date, which is a quantified version of the staleness the essay attributes to enterprise wikis."
    quote: "Most organizations face a fundamental knowledge quality problem: content decays faster than teams can review it. Manual verification processes typically reach only 8-12% of organizational content, leaving the rest to slowly become outdated."
    source: guru-verification-help
    source_quality: medium
    as_of_date: "2026"
    limitations: "A vendor stating the size of the problem its own product is sold to solve; no method, sample or study is named for the 8 to 12 percent figure."

  - id: ell-166
    finding: "Gurkan, Stonedahl and Wilensky report that when an LLM repeatedly mutates a program without selection pressure, the chains converge: in 87 percent of chains, over 93 percent of mutations revisit a previously seen structural form."
    quote: "We find that LLM-based mutation consistently converges toward restricted attractor regions in program space. Convergence is especially severe at the structural level: in 87% of chains, over 93% of mutations revisit a previously seen structural form, with most variation confined to terminal substitutions within recurring templates."
    source: llm-convergence-arxiv
    source_quality: high
    as_of_date: "2026"
    limitations: "An arXiv preprint's abstract, not peer reviewed at the time of reading. The domain is programs in a domain-specific language, not prose, and the chains run without selection pressure, which is a harsher condition than a working corpus with an operator in the loop."

  - id: ell-167
    finding: "Gurkan, Stonedahl and Wilensky report that a classical genetic-programming mutation operator does not converge comparably, which they take to mean the convergence is intrinsic to the LLM pipeline rather than to iterative mutation as such."
    quote: "A classical GP subtree mutation operator does not exhibit comparable convergence, suggesting that the effect is intrinsic to the LLM mutation pipeline."
    source: llm-convergence-arxiv
    source_quality: high
    as_of_date: "2026"
