  # ================= External evidence =================
  # Grading rule used throughout, from ERF-9: reference documentation in which a
  # vendor or body defines a mechanism it owns is read as `high` (a primary read
  # directly); a marketing or capability claim by the same party about the same
  # product is `medium` (a first party with an interest in the answer); an
  # encyclopedia summarising someone else's work is `medium` (an identifiable
  # intermediary reporting someone else's fact).

  # ---- Human/AI authorship attribution ----

  - id: ell-100
    finding: "Anysphere's own documentation for Cursor Blame states that the feature extends git blame with AI attribution so a reader can see which code was AI-generated and which was human-written, which is the fact the essay reports at one hop."
    quote: "Cursor Blame extends traditional git blame with AI attribution, so you can see what was AI-generated versus human-written."
    source: cursor-blame-docs
    source_quality: high

  - id: ell-101
    finding: "Anysphere's documentation states that Cursor Blame records which model produced agent-generated code, which is the model-level granularity the essay attributes to it."
    quote: "Agent-generated code shows which model produced it, helping you understand AI tool usage across your codebase."
    source: cursor-blame-docs
    source_quality: high

  - id: ell-102
    finding: "Anysphere's documentation states that Cursor Blame is available on the Enterprise plan, a restriction the essay's description of the feature does not mention."
    quote: "Available on the [...], it helps you understand the origin of each line when you review or revisit code"
    source: cursor-blame-docs
    source_quality: high
    limitations: "The elision removes a markdown link naming the Enterprise plan and its sales URL; the plan restriction is carried by the link text, not by the surrounding prose, so this quote evidences the sentence and the finding's plan claim rests on the elided link."

  - id: ell-103
    finding: "The agentblame project's README states that it tracks AI-generated code in git history and works with Cursor, Claude Code and OpenCode, which shows that line-level AI attribution for code is not confined to the one product the essay names as the exception."
    quote: "Works silently with Cursor, Claude Code, and OpenCode"
    source: agentblame-github
    source_quality: medium
    limitations: "A project README written by the tool's own authors; it states capability and gives no independent evaluation of accuracy or of adoption."

  - id: ell-104
    finding: "The agentblame project's README states that it puts AI-generated versus human-written line counts and an overall AI percentage at the top of every pull request, which is authorship attribution below the grain of a whole document and outside the one product the essay names."
    quote: "PR summary at the top of every PR showing AI-generated vs human-written line counts and overall AI percentage"
    source: agentblame-github
    source_quality: medium
    limitations: "A project README written by the tool's own authors; capability claimed, not measured."

  - id: ell-105
    finding: "GitHub's reference documentation states that a commit message may carry `Co-authored-by` trailers attributing the commit to multiple authors, which is a standing git-native mechanism for recording an additional author on a change."
    quote: "Add one or more `Co-authored-by` trailers to a commit message to attribute a commit to multiple authors."
    source: github-co-authored-by
    source_quality: high
    limitations: "The mechanism attributes a commit to a named person or account and says nothing about whether that author is a human or an AI tool; it is the carrier the AI-attribution practice uses, not the practice itself."

  - id: ell-106
    finding: "Grammarly's own product page states that Authorship can be enabled directly in Microsoft Word, Google Docs and Canvas LMS submissions, which contradicts the essay's description of it as a sidecar confined to Grammarly's own app."
    quote: "You can enable Authorship directly in Microsoft Word, Google Docs, and Canvas LMS submissions."
    source: grammarly-authorship
    source_quality: medium
    limitations: "A vendor marketing page about the vendor's own product; the claim is about where the feature can be turned on and not about how well it works."

  - id: ell-107
    finding: "Grammarly's own product page states that Authorship identifies, sentence by sentence, whether text was written by the user, came from a website, came from a Grammarly suggestion, or came from a non-web source, which is authorship recorded below the grain of a whole page."
    quote: "Grammarly Authorship, meanwhile, helps you keep track of version history and where text in your writing came from. It doesn’t just show you where you used AI; it also identifies if sentences were written by you or came from a website, a Grammarly suggestion, or a non-web source."
    source: grammarly-authorship
    source_quality: medium
    limitations: "A vendor marketing page, and the passage is written to distinguish the product from AI detectors, so it is stated in the most favourable terms available; no accuracy figure is given."

  - id: ell-108
    finding: "The C2PA consortium states that it publishes an open technical standard by which publishers, creators and consumers can establish the origin and edits of a piece of digital content, which is a shipped provenance primitive for content outside the coding domain."
    quote: "The Coalition for Content Provenance and Authenticity, or C2PA, provides an open technical standard for publishers, creators and consumers to establish the origin and edits of digital content."
    source: c2pa-about
    source_quality: medium
    limitations: "The consortium's own description of its own standard. It evidences that the standard exists and not that any knowledge-work tool has adopted it."

  # ---- Claim-level checking ----

  - id: ell-109
    finding: "Google's reference documentation for the check grounding API states that the API returns a support score from 0 to 1 and citations to the facts supporting each claim in the text being checked, which is a shipped mechanical check running at the grain of the claim."
    quote: "The check grounding API returns an overall support score of 0 to 1, which indicates how much the answer candidate agrees with the given facts. The response also includes *citations* to the facts supporting each claim in the answer candidate."
    source: vertex-check-grounding
    source_quality: high

  - id: ell-110
    finding: "Google's reference documentation defines perfect grounding as every claim in the checked text being wholly entailed by the given facts, and states that a partially entailed claim is not grounded, which is an entailment test of exactly the kind the essay defines under the name of a semantic check."
    quote: "Perfect grounding requires that every claim in the answer candidate must be supported by one or more of the given facts. In other words, the claim is wholly entailed by the facts. If the claim is only partially entailed, it is not considered grounded."
    source: vertex-check-grounding
    source_quality: high

  - id: ell-111
    finding: "Google's reference documentation states that in the current version of the check grounding API a sentence is treated as a single claim, which bounds how far the shipped check reaches toward the claim as a unit."
    quote: "In this version of the check grounding API, a sentence is considered a single claim."
    source: vertex-check-grounding
    source_quality: high

  - id: ell-112
    finding: "The Ragas documentation defines its Faithfulness metric as scoring a response faithful when all of its claims can be supported by the retrieved context, which is a published, re-runnable test defined over claims."
    quote: "A response is considered **faithful** if all its claims can be supported by the retrieved context."
    source: ragas-faithfulness
    source_quality: high

  - id: ell-113
    finding: "The Ragas documentation gives the procedure its Faithfulness metric runs: identify all the claims in a response, then check each claim against the retrieved context, then compute a score as the ratio of supported claims to total claims."
    quote: "To calculate this: 1. Identify all the claims in the response. 2. Check each claim to see if it can be inferred from the retrieved context."
    source: ragas-faithfulness
    source_quality: high
    limitations: "The claim decomposition and the entailment judgment are both performed by an LLM, so the test is mechanical in its plumbing and probabilistic in its verdicts; the documentation states the procedure, not its reliability."

  - id: ell-114
    finding: "The TruLens documentation states that its groundedness evaluation separates a response into individual claims and searches for evidence supporting each within the retrieved context, which is a second independent implementation of a claim-level check."
    quote: "To verify the groundedness of our application, we can separate the response into individual claims and independently search for evidence that supports each within the retrieved context."
    source: trulens-rag-triad
    source_quality: medium
    limitations: "A vendor describing the method of its own evaluation product; the method is described and not measured."

  - id: ell-115
    finding: "Schema.org defines a ClaimReview type as a fact-checking review of claims made or reported in some creative work, which is a published interchange vocabulary whose unit is the claim rather than the page."
    quote: "A fact-checking review of claims made (or reported) in some creative work (referenced via itemReviewed)."
    source: schemaorg-claimreview
    source_quality: high

  - id: ell-116
    finding: "Scite states that its Smart Citations show how later research supported, challenged or discussed a paper, claim, method, journal, author, institution or funder, which is a shipped commercial product whose unit of evidence classification is the claim."
    quote: "Smart Citations show how later research has supported, challenged, or discussed a paper, claim, method, journal, author, institution, or funder, while Scite’s AI Assistant uses those same evidence signals to ground answers in the broader literature."
    source: scite-site
    source_quality: medium
    limitations: "A vendor marketing page about the vendor's own product; classification accuracy is asserted rather than reported."

  - id: ell-117
    finding: "Samsonau's arXiv abstract states that sciwrite-lint applies the linting paradigm from software engineering to citation verification and checks reference existence, metadata accuracy, retraction status and claim support, which is a lint for provenance in the essay's own sense of the word."
    quote: "sciwrite-lint applies the linting paradigm from software engineering to citation verification: it runs entirely on the researcher's machine (free public databases, a single consumer GPU, and open-weights models), is fast enough to re-lint between revisions so authors catch problems at the source"
    source: sciwrite-lint-arxiv
    source_quality: medium
    as_of_date: "2026"
    limitations: "An arXiv preprint's abstract, describing the authors' own tool and not reviewed; the capability is stated and the evaluation is not in the quoted text."

  # ---- Provenance and evidence primitives that predate LLMs ----

  - id: ell-118
    finding: "Kuhn and Krauthammer's 2012 position paper states that nanopublications were developed to make core scientific statements easier to find, connect and curate and to determine their attribution, quality and provenance, which places a claim-grain provenance primitive in the literature more than a decade before the essay."
    quote: "Nanopublications have been developed to make it easier to find, connect and curate core scientific statements and to determine their attribution, quality and provenance [2]."
    source: arxiv-nanopub-claims
    source_quality: high
    as_of_date: "2012"

  - id: ell-119
    finding: "Kuhn and Krauthammer's 2012 position paper distinguishes two kinds of nanopublication, claims and data, with claims obtained by generalizing from data, which is a typed distinction of the kind the essay says mainstream tools do not make."
    quote: "There seem to be two possible types of nanopublications: they can represent claims or data."
    source: arxiv-nanopub-claims
    source_quality: high
    as_of_date: "2012"

  - id: ell-120
    finding: "The Monarch Initiative states that SEPIO is an OWL ontology built to support computable representations of the evidence and provenance behind scientific assertions, which is a published primitive for exactly the pairing of evidence and provenance the essay says no tool adds."
    quote: "The **Scientific Evidence and Provenance Information Ontology** (**SEPIO**) is an OWL ontology developed to support rich, computable representations of the evidence and provenance behind scientific assertions."
    source: sepio-github
    source_quality: high

  - id: ell-121
    finding: "The Monarch Initiative's own README warns that the SEPIO ontology in that repository is out of date with the SEPIO model's later development, which is evidence about the maintenance cost of such a primitive rather than about its absence."
    quote: "The ontology here is out of date with the most recent developments in the SEPIO Model"
    source: sepio-github
    source_quality: high

  - id: ell-122
    finding: "Wikipedia's article on W3C PROV states that the PROV standard defines a data model, serializations and definitions for interchanging provenance information on the web, which is a W3C recommendation for provenance interchange predating the LLM era."
    quote: "The PROV standard defines a data model, serializations, and definitions to support the interchange of provenance information on the Web."
    source: prov-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summarising a standards document; identifiable but one hop from the recommendation itself, which could not be retrieved directly because the W3C site served a bot challenge to the fetch."

  - id: ell-123
    finding: "The Discourse Graphs project states that it represents research as connected claims, evidence, questions and projects, which is a shipped model whose unit is the claim rather than the page or the chunk."
    quote: "Discourse Graphs help teams move beyond static documents by representing research as connected claims, evidence, questions, and projects."
    source: discourse-graphs
    source_quality: medium
    limitations: "The project's own description of itself; adoption and whether any implementation performs a check are not addressed."

  - id: ell-124
    finding: "The Discourse Graphs project states that its model separates observations from interpretations so that shared knowledge can be compared and updated without flattening disagreement, which is a typed distinction between evidence and assertion of the kind the essay proposes."
    quote: "Separate observations from interpretations so researchers can compare, remix, and update shared knowledge without flattening disagreement."
    source: discourse-graphs
    source_quality: medium
    limitations: "The project's own description of itself; no implementation or check is named in the quoted text."

  - id: ell-125
    finding: "Hypothesis states that its users can highlight and comment directly on online articles, websites and videos without leaving the page, which is an anchored annotation layer over third-party sources and the nearest widely deployed relative of the essay's capture primitive."
    quote: "Students, faculty, and colleagues can highlight and comment directly on online articles, websites, videos, and more without switching platforms."
    source: hypothesis-about
    source_quality: medium
    limitations: "A marketing page aimed at higher education, describing annotation only; nothing in it claims that an annotation's quote is checked against its source, which is why this is a near-miss and not a counterexample."

  # ---- Argument structure as a mechanical primitive ----

  - id: ell-126
    finding: "Wikipedia's article on argument maps states that the different styles are often functionally equivalent and represent an argument's individual claims and the relationships between them, which is a claim-grain representation of argument structure with a literature behind it."
    quote: "There are different styles of argument map but they are often functionally equivalent and represent an argument's individual claims and the relationships between them."
    source: argument-map-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summary of a field rather than a primary text from it."

  - id: ell-127
    finding: "Wikipedia's article on argument maps states that the purpose of mapping is to uncover logical structure, identify unstated assumptions and evaluate the support an argument offers for a conclusion, which is the work the essay says knowledge work has no primitive for."
    quote: "The purpose of mapping is to uncover the logical structure of arguments, identify unstated assumptions, evaluate the support an argument offers for a conclusion, and aid understanding of debates."
    source: argument-map-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summary; it states the purpose of a practice, not the existence or adoption of any tool."

  - id: ell-128
    finding: "Wikipedia's article on Kialo states that a Kialo debate divides into pro and con columns in which registered users add arguments and rate their impact on the weight or validity of the parent claim, which is a deployed system operating on claims and their relations."
    quote: "A debate is divided into Pro (supporting) and Con (refuting or devaluing) columns where registered users can add arguments and [...] the impact on the weight or validity of the parent claim."
    source: kialo-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summary of a commercial platform; the elision removes a markdown link on the word rating."

  - id: ell-129
    finding: "Wikipedia's article on Kialo states that its argument tree structure enables detailed scrutiny of claims at all levels of the tree, which is claim-level scrutiny in a shipped product."
    quote: "Its argument tree structure enables detailed scrutiny of claims at all levels of the tree"
    source: kialo-wikipedia
    source_quality: medium
    limitations: "An encyclopedia summary of a commercial platform, sourced in the article to a third party."

  - id: ell-130
    finding: "The Argdown project states that its notation can be used inside markdown and is transformed into an argument map as the author types, which puts argument structure into plain text files where an ordinary line diff applies to it."
    quote: "Argdown can even be used within Markdown! Your code is transformed into an argument map while you are typing."
    source: argdown-site
    source_quality: medium
    limitations: "The project's own home page; that the structure is plain text is checkable from the notation itself, that anyone diffs it is not claimed here."

  - id: ell-131
    finding: "The Argdown project states that its rules let an author define relations between arguments and the logical premise-conclusion structure inside them, which is the premise relation the essay's own claim model needs, expressed in a text format that predates the essay."
    quote: "With these simple rules you will be able to define more complex relations between arguments or dive into the details of their logical premise-conclusion structures."
    source: argdown-site
    source_quality: medium
    limitations: "The project's own home page, stating capability."

  # ---- Recording judgment ----

  - id: ell-132
    finding: "Nygard's 2011 post proposes keeping a collection of records for architecturally significant decisions, which is the founding text of a recorded-judgment practice that predates the essay by fifteen years."
    quote: "We will keep a collection of records for \"architecturally significant\" decisions: those that affect the structure, non-functional characteristics, dependencies, interfaces, or construction techniques."
    source: adr-nygard
    source_quality: high
    as_of_date: "2011-11-15"

  - id: ell-133
    finding: "Nygard's 2011 post names the problem the practice addresses in terms close to the essay's own: that the motivation behind past decisions is among the hardest things to track over a project's life."
    quote: "One of the hardest things to track during the life of a project is the motivation behind certain decisions."
    source: adr-nygard
    source_quality: high
    as_of_date: "2011-11-15"

  - id: ell-134
    finding: "Nygard's 2011 post specifies that decision records are numbered sequentially and monotonically and that numbers are never reused, which is the same permanent-identifier discipline the essay's claim model assumes."
    quote: "ADRs will be numbered sequentially and monotonically. Numbers will not be reused."
    source: adr-nygard
    source_quality: high
    as_of_date: "2011-11-15"

  - id: ell-135
    finding: "The adr organization states that a decision record captures a single decision and its rationale, that a project's collection of them constitutes its decision log, and that the practice extends beyond architecture to any decision record."
    quote: "The collection of ADRs created and maintained in a project constitute its *decision log*. All these are within the topic of Architectural Knowledge Management (AKM), but ADR usage can be extended to design and other decisions (“any decision record”)."
    source: adr-github-io
    source_quality: high

  # ---- Retrieval products and graph tooling ----

  - id: ell-136
    finding: "Glean's home page states that permission-aware access is built into the product, which corroborates the permission-aware half of the essay's description of what company-brain products actually ship."
    quote: "Permissions. Secure, permission-aware access built in from day one."
    source: glean-site
    source_quality: medium
    limitations: "A vendor home page; the claim is marketing copy about the vendor's own product and carries no detail about the permission model."

  - id: ell-137
    finding: "Glean's home page states that enterprise AI works only when answers are secure, explainable and permission-aware, which is the vendor's own framing of what its product is for and matches the essay's read of the category."
    quote: "AI only works in the enterprise when answers are secure, explainable, and permission-aware."
    source: glean-site
    source_quality: medium
    limitations: "Vendor marketing copy; a normative claim about the category from a participant in it."

  - id: ell-138
    finding: "Microsoft Research states that GraphRAG extracts a knowledge graph from raw text, builds a community hierarchy and generates summaries over it before retrieval, which is an LLM-built structure rather than the pre-LLM storing, linking and retrieving the essay says most tools still do."
    quote: "The GraphRAG process involves extracting a knowledge graph out of raw text, building a community hierarchy, generating summaries for these communities, and then leveraging these structures when perform RAG-based tasks."
    source: graphrag-ms
    source_quality: medium
    limitations: "The producing organization's own documentation for its own method; the quoted sentence describes the process and reports no result. The sentence contains a grammatical error present in the source."

  - id: ell-139
    finding: "Zep states that Graphiti's context graphs track how facts change over time and maintain provenance to source data, which is a shipped graph tool whose stored unit carries provenance rather than only text."
    quote: "Graphiti's context graphs track how facts change over time, maintain provenance to source data, and support both prescribed and learned ontology"
    source: graphiti-github
    source_quality: medium
    limitations: "A project README written by the vendor; provenance to source data is claimed and its granularity is not specified in the quoted text."

  - id: ell-140
    finding: "Zep states that each fact in a Graphiti context graph carries a validity window recording when it became true and when it was superseded, which is a dated lifecycle on a unit smaller than a document."
    quote: "Unlike traditional knowledge graphs, each fact in a context graph has a validity window: when it became true, and when (if ever) it was superseded."
    source: graphiti-github
    source_quality: medium
    limitations: "A vendor README; the mechanism is described and no evaluation of its accuracy is offered."

  - id: ell-141
    finding: "Notion's help documentation states that a workspace page can be verified to show its contents are up to date, for a chosen period or indefinitely, which is the whole-page verification the essay attributes to it."
    quote: "You can verify content in your workspace to show that its contents are up to date. You can choose to keep a page verified for a certain period of time or indefinitely."
