# Atoms. `created` defaults to 2026-08-25 / anthropic/claude-opus-5 in the builder.
#
# Grading, per ERF-9 and ERF-10: an atom quoting the essay about the author's
# own practice, stipulations or positions is `high` — the finding's subject is
# the utterance, the utterer is named and accountable, and there is no relay.
# An atom quoting the essay about the world (a vendor's feature, a field's
# history) is `medium`: the author is an identifiable intermediary reporting
# someone else's fact, and an interested one. Same source, two grades, which is
# the split section 4.2 says is deliberate.
atoms:

  # ---- The essay on its own scope, posture and practice (high) ----

  - id: ell-001
    finding: "The essay's opening asserts a maturity gap: as of its 19 August 2026 version it holds that AI assistance is far advanced for coding while the wider field of knowledge work is undeveloped, which is the gap the whole document is written to address."
    quote: "So much has been done for AI-assisted coding, but for the wider spectrum of knowledge work it's still the Wild West."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-002
    finding: "The essay stipulates what it means by knowledge work, and the stipulation is a scope declaration rather than a definition offered for dispute: researching, synthesizing sources, producing documents, and keeping order over accumulated information."
    quote: "By knowledge work I mean researching a topic, synthesizing sources, producing documents, and keeping order and control over the accumulation of information."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-003
    finding: "The essay states that it excludes coding from its scope on purpose, giving two reasons, coding's own history and its own specific use of LLMs, which means every claim in the document is to be read as a claim about non-coding knowledge work."
    quote: "Coding is deliberately set aside because it has its own history and its own specific use of LLMs."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-004
    finding: "The essay states what it takes epistemology to mean for its purposes, which is the tracking of provenance and trust to the point where a written assertion can be relied on."
    quote: "In our case, it means tracking provenance and trust so that a written assertion can be relied on."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-005
    finding: "The essay asserts that the layer managing provenance-and-trust connections is not yet mainstream, which is the gap the document proposes to fill; it is stated as a present-tense fact about available tooling and not as a prediction."
    quote: "Managing those connections is a whole layer that is not yet mainstream."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-006
    finding: "The essay proposes that knowledge-work tools should file text by epistemic type, and enumerates seven types the tools should tell apart: a captured source, a verified fact, an asserted claim, an argument over claims, a position held, an open question, and a ruling."
    quote: "A captured source, a verified fact, an asserted claim, an argument over claims, a position held, an open question, and a ruling are different things, and the tools need to tell them apart."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-007
    finding: "The essay defines the evidence primitive it calls an atom as one quote from one source, sized to support a single point, which is the granularity commitment the rest of its grounding argument rests on."
    quote: "Each piece of evidence (I call those \"atoms\") should be one quote from one source, small enough to support a single point."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-008
    finding: "The essay states the consequence it draws from missing first-party attribution: a year later the operator cannot separate verdicts they adjudicated themselves from verdicts an LLM supplied."
    quote: "Without a record of authorship, you can't tell a year later which verdicts you adjudicated from the ones the LLM filled in for you."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-009
    finding: "The essay asserts that recording human judgment is the newest of the practices it lists, that few people think about it, and that tooling for it is close to absent; the tooling half is stated as a fact about the world rather than about the author's setup."
    quote: "Of everything on this list this is the newest practice. Few people think about it, and there is next to no tooling for it."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-010
    finding: "The essay states a design constraint on the tools it proposes, that they must bring material in the form the operator needs and must never generate chores of their own, naming correcting the AI's mistakes and re-checking verified material as the chores to avoid."
    quote: "They should bring the material the task needs, in the form the operator needs it, and they should never create chores of their own (correcting the AI's mistakes, re-checking what has already been verified)."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-011
    finding: "The essay decomposes AI governance into at least three layers, which is the decomposition the rest of section 1 and section 3 depend on."
    quote: "\"AI governance\" covers at least three layers."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-012
    finding: "The essay names its third governance layer, the workspace layer, as files, folders, workflows and lifecycle states, that is, the working environment itself treated as governed data."
    quote: "The workspace layer: files, folders, workflows, and lifecycle states, the working environment itself treated as governed data."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-013
    finding: "The essay asserts, of the workspace layer it has just defined, both that the AI-governance conversation omits it and that companies outside regulated industries do not practise it; the assertion is a universal negative over two distinct populations."
    quote: "This last layer is missing from the AI-governance conversation, and outside regulated industries, from what companies are doing."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-014
    finding: "The essay records the boundary of its own evidence base: everything it proposes has been tested in a one-person setup, and how the approach would be shared between people is stated by the author as unresolved."
    quote: "Everything above has been tested within a one-person setup, and how it gets shared is still an open question."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-015
    finding: "The essay states the sharing requirement it takes from the interoperability literature, that two people need a source, a verified claim and a ruling to mean the same thing on both sides."
    quote: "Two people need semantic interoperability, which means a source, a verified claim, or a ruling must mean the same thing to both of them."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-016
    finding: "The essay attributes the term pragmatic interoperability to an existing literature rather than coining it, and glosses it as applying the same standard of care to the data captured."
    quote: "To go a little further, there is also what the literature calls pragmatic interoperability, which is about applying the same standard of care to the data that gets captured."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-017
    finding: "The essay states its central diagnostic thesis, that a working discipline forms only once its primitives are mechanical, which is the premise from which its account of why knowledge work has no such discipline follows."
    quote: "Primitives need to be mechanical for a working discipline to form."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-018
    finding: "The essay asserts three specific absences in knowledge work, no diff for arguments, no test that runs on claims as a document grows, and no lint for provenance, and draws from them the conclusion that the corresponding disciplines have not crystallized."
    quote: "Knowledge work has no diff for arguments, no test that runs on claims as a document grows, no lint for provenance, so the corresponding disciplines haven't crystallized."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-019
    finding: "The essay asserts a repeated historical failure of general-purpose knowledge-work primitives and gives its diagnosis, a tension between being specific enough to be efficient and open enough for varied workflows."
    quote: "Primitives for knowledge work in general have failed again and again: the space is challenging for one tool to be both specific enough to be efficient and open enough for a great variety of workflows."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-020
    finding: "The essay asserts that the SaaS products which succeeded in this space did so by picking one use case together with workflow constraints, and that the same constraints are the reason those products frustrate users."
    quote: "The SaaS products that succeeded picked a use case along with workflow constraints, and frustrate users for that very reason."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-021
    finding: "The essay characterizes the personal knowledge management field as broadly manual across building, curating and using, which is the labour cost its LLM-economics argument claims to remove."
    quote: "Building, curating, and then using those systems is manual work, and that is broadly the state of the \"personal knowledge management\" field."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-022
    finding: "The essay reports the outcome of its own survey of the field: many tools and patterns exist for memory, context and knowledge graphs, most do the pre-LLM thing of storing, linking and retrieving text, and few have moved beyond that."
    quote: "After researching the field, I found plenty of tools and patterns for \"memory\", \"context\", and knowledge graphs. Most of them do a fairly old thing (storing, linking, and retrieving text), and few have moved beyond what was done before LLMs."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"
    limitations: "The essay reports the conclusion of a survey without recording its instrument, its queries, its scope or its yield, so the coverage behind \"after researching the field\" cannot be assessed from this quote or from anything else in the document."

  - id: ell-023
    finding: "The essay states the sharpest of its universal negatives, that none of the memory, context and knowledge-graph tools it surveyed adds a primitive for checked provenance, for checking claims, or for recording what a person stands behind."
    quote: "What none of them add is a primitive for checked provenance, for checking claims, or for recording what you stand behind."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-024
    finding: "The essay states the durability bet it is making, that records, disciplines and surfaces built on the right primitives outlast any particular LLM and grow more useful with each new one."
    quote: "Built on the right primitives, the records, the disciplines, and the surfaces all outlast any particular LLM, and each new LLM makes them more useful."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-025
    finding: "The essay distinguishes three kinds of check by what each one reads, and gives a worked question for each: text only, meaning, and interpreter-plus-purpose."
    quote: "A syntactic check looks only at the text itself, not its meaning: \"is this quote present in that source?\". A semantic check reads its meaning: \"does this claim follow from that quote?\". A pragmatic check depends on the interpreter and the purpose: \"is this the right argument for this reader?\"."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-026
    finding: "The essay asserts an ordering of how well the three kinds of check mechanize, syntactic reliably, semantic partially, pragmatic least, which is what its case for building on syntactic primitives first rests on."
    quote: "Syntactic checks mechanize reliably, semantic checks partially, pragmatic checks least."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-027
    finding: "The essay states the failure mode it attributes to unstructured prose in an LLM pipeline, that the automation becomes undifferentiated and nothing in particular ends up being checked."
    quote: "Handing unstructured prose to the LLM turns the output into one woolly ball of automation where nothing in particular is being checked."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-028
    finding: "The essay states that separability of its pieces is a deliberate design decision, gives an adoption reason for it, and names the Unix habit of small composing tools as the model."
    quote: "Keeping them separable is a design decision. It keeps the whole from becoming a single system nobody adopts, and it follows the Unix habit of small tools that each do one thing and compose."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-029
    finding: "The essay specifies what its atom primitive carries so the evidence can be used away from its source: a verbatim quote, a link to the original, retrieval metadata with its date, and the context needed to support the quote."
    quote: "An atom carries everything you need to use a piece of evidence away from its source. A verbatim quote, a link to the original source, metadata about the retrieval and its date, and the context needed to support that quote."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-030
    finding: "The essay reports a first-party fact about the author's own build: he asserts that nothing keeps an authorship record across a working corpus and that he therefore built a shadow record committing at every file save with who made the change, person or AI."
    quote: "Nothing keeps that record across a working corpus, so I built one: a shadow record that commits at every file save with who made the change, person or AI."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-031
    finding: "The essay specifies its standing vocabulary as four values, proposed, held, contested and retired, and specifies that only the operator moves a claim between them."
    quote: "Each claim carries a standing (proposed, held, contested, or retired), and only the operator moves it."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-032
    finding: "The essay specifies that a change of standing is dated in the file's history, so that a withdrawal is recorded as an event rather than performed as a deletion."
    quote: "Each move is dated in the file's history, so a withdrawal is a recorded event rather than a deletion."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-033
    finding: "The essay reports a first-party finding from the author's own practice: he underestimated how much constraint LLM use and his own workflows needed, and found that adding governance was where most of the value turned out to be."
    quote: "I had underestimated the amount of constraints I needed to impose on LLM use and on my own workflows. Again and again, I had an artifact that was produced quickly but needed a lot of work to get into a good final shape. The solution was to add more governance and it is where most of the value turned out to be."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-034
    finding: "The essay reports a first-party side effect the author observed, that shaping a workflow to suit an LLM sharpened his own thinking about the kinds of document he works on."
    quote: "Optimizing your workflow to fit an LLM turns out to sharpen your own thinking about the kinds of documents you work on."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-035
    finding: "The essay records the size and shape of the only deployment behind it, 500-plus atoms, one operator, about six months, and states plainly that the author does not know how the approach breaks at larger scale."
    quote: "What I do not know is how this breaks at larger scale. My system holds 500+ atoms, with one operator, in about six months."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-036
    finding: "The essay defines knowledge, for its purposes, as text a person can check, combine and stand behind, and asserts that before LLMs those three properties were largely invisible to software."
    quote: "Knowledge is text you can check, combine, and stand behind. Pre-LLMs, those properties were largely invisible to software."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-037
    finding: "The essay states the conditional bet at the centre of its forward-looking section: if LLMs make it possible to operate quickly on knowledge, knowledge work gets its own round of methodologies, which it expects to resemble the original Agile field."
    quote: "LLMs now make it possible to operate quickly on knowledge. If that holds, knowledge work gets its own round of new (or re-newed) methodologies, probably inspired by the original Agile field."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-038
    finding: "The essay's verdict on the company-brain naming is that the word describes no mechanism: it anthropomorphizes and specifies nothing."
    quote: "The word anthropomorphizes and specifies nothing."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-039
    finding: "The essay gives its structural diagnosis of company-brain products, that their unit is the page or the chunk rather than the claim, and derives the three absences it goes on to name from that choice of unit."
    quote: "The unit in those products is the page or the chunk, not the claim, which is why the rest is absent."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-040
    finding: "The essay asserts that agentic AI is being marketed while the layer beneath it is underserved, and that non-deterministic workflows need a quality of structure that has not had time to emerge outside coding."
    quote: "Agentic AI is being marketed while much of what sits underneath it is underserved."
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  - id: ell-041
    finding: "The essay defines entailment, for its purposes, as a reader test: would someone holding only the quote and its surrounding context accept the claim that cites it."
    quote: "whether the quote actually supports the claim that cites it: would a reader holding only the quote, with its surrounding context, accept the claim?"
    source: essay-2026-08-19
    source_quality: high
    as_of_date: "2026-08-19"

  # ---- The essay on the world: an identified but interested relay (medium) ----

  - id: ell-042
    finding: "François Bouet states, in an August 2026 manuscript, that knowledge management was attempted in the 1990s and that the manual work of building and maintaining it created too much friction to scale; he offers no source for the historical claim."
    quote: "Knowledge management tried this in the '90s, and the manual work it took to build and maintain created too much friction for it to scale."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A single author's unsourced summary of a decade of practice, relayed at one hop. Graded medium because he is identified and answerable but is neither a participant-witness he cites nor a study he names."

  - id: ell-043
    finding: "François Bouet states, in an August 2026 manuscript, that LLMs are removing most of the manual labour that sank 1990s knowledge management, and treats that removal as the reason the field is worth reviving now."
    quote: "LLMs are taking most of that work away, which is why it's timely to give it a second chance."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "The author's own read of what LLMs remove, from a one-operator deployment; he is an interested party in the conclusion, and no measurement is offered."

  - id: ell-044
    finding: "François Bouet states, in an August 2026 manuscript, that material carrying its sources and its epistemic kind can be fed into further LLM calls with less risk of hallucination; the claim is stated as a general property and not as a measured result."
    quote: "Material that keeps its sources and its kind (a verbatim quote, a checked claim, a guess) can be fed into further LLM calls with less risk of hallucination."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "An unmeasured mechanism claim about LLM behaviour, made by an author whose proposal depends on it. Nothing in the document quantifies \"less risk\"."

  - id: ell-045
    finding: "François Bouet states, in an August 2026 manuscript, that loose AI-flavoured prose recycled from call to call degrades quickly; no measurement, corpus or study is cited for the degradation."
    quote: "Loose AI-flavored prose, recycled from call to call, degrades quickly."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "Unquantified and unsourced; \"degrades\" is not defined and no rate is given."

  - id: ell-046
    finding: "François Bouet states, in an August 2026 manuscript, that mainstream tools file text by subject, format, author and date, which he offers as the contrast to filing by epistemic type."
    quote: "Mainstream tools file text by subject, format, author, and date."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A characterization of a whole product category by one author, with no product named and no survey behind it."

  - id: ell-047
    finding: "François Bouet states, in an August 2026 manuscript, that trustworthiness of text has been tracked only in niches and only by hand, and names three: legal citators, source grading for intelligence work, and peer review."
    quote: "How far a piece of text can be trusted has been tracked only in niches, and by hand, in legal citators, in source grading for intelligence work, in peer review."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "Two assertions travel together here, that the practice is confined to niches and that it is manual; the second is checkable against the citators themselves and the author cites nothing."

  - id: ell-048
    finding: "François Bouet states, in an August 2026 manuscript, that today's tools do not record whether a piece of work was written by a human or an AI tool, stated flatly and without qualification as to product category."
    quote: "Today's tools don't record whether something was written by a human or an AI tool."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A universal negative over an unbounded population of tools, from an author who names four exceptions of his own within the next four sentences."

  - id: ell-049
    finding: "François Bouet states, in an August 2026 manuscript, that a Google Doc names a text's authors but records nothing finer, and that text written with Gemini is filed under the human's name."
    quote: "A Google Doc names the authors of a text but nothing finer, and text written with Gemini is filed under the human's name."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A relayed description of a third-party product's behaviour, unsourced; Google Docs' revision history and activity log are not addressed."

  - id: ell-050
    finding: "François Bouet states, in an August 2026 manuscript, that git records every change but at a coarser grain than he needs and without recording AI use."
    quote: "Git records every change, but at a coarser grain, and without recording AI use."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A relayed description of a third-party tool, unsourced; git's own trailer mechanism for co-authorship is not addressed."

  - id: ell-051
    finding: "François Bouet states, in an August 2026 manuscript, that code is the exception to his no-AI-attribution claim, and that Cursor Blame marks which lines an AI wrote and with which model."
    quote: "The exception is code, where Cursor Blame now marks which lines an AI wrote and with which model."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A vendor feature described at one hop, with no citation to the vendor's own documentation and no date for when the feature shipped."

  - id: ell-052
    finding: "François Bouet states, in an August 2026 manuscript, that the nearest equivalent for prose is Grammarly's authorship report, which he describes as a per-document sidecar living inside Grammarly's own app."
    quote: "The nearest thing for prose is Grammarly's authorship report, a per-document sidecar inside its own app."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A vendor feature described at one hop, with no citation; whether it is the nearest equivalent is a judgment resting on a survey the document does not record."

  - id: ell-053
    finding: "François Bouet states, in an August 2026 manuscript, that a CRM has to be maintained by hand and decays because of it, offered as the company-scale instance of his manual-work diagnosis."
    quote: "A CRM has to be maintained by hand and decays because of it."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "An unsourced generalization about a product category; no decay rate is given and automated enrichment and activity capture are not addressed."

  - id: ell-054
    finding: "François Bouet states, in an August 2026 manuscript, that enterprise wikis, naming Confluence and SharePoint, go stale the same way a CRM does, ending in a mass clean-up or abandonment."
    quote: "The enterprise wiki (Confluence, SharePoint) goes stale the same way, until people have had enough and either go for a big clean-up or drop it entirely."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "Unsourced, and stated without a measure of staleness or a share of deployments to which it applies."

  - id: ell-055
    finding: "François Bouet states, in an August 2026 manuscript, that speech-to-text became ubiquitous in 2026 and was a major productivity boost, while asserting in the same sentence that little beyond it is more sophisticated than a chatbot."
    quote: "Speech-to-text became ubiquitous in 2026 and was a major productivity boost, but beyond that little exists that is more sophisticated than a chatbot, and every power user of Claude Code has felt the limitations."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026"
    limitations: "\"Ubiquitous\" is unquantified and undated within the year; the productivity claim is the author's own experience generalized, and \"every power user of Claude Code\" is a claim about other people's experience with no survey behind it."

  - id: ell-056
    finding: "François Bouet states, in an August 2026 manuscript, that the web was meant to be semantic while what accumulated was unstructured, and that big data with machine learning was built to make sense of it after the fact."
    quote: "The web was meant to be semantic but what accumulated was unstructured. Big data, with machine learning, was built to make sense of it after the fact."
    source: essay-2026-08-19
    source_quality: medium
    as_of_date: "2026-08-19"
    limitations: "A compressed history relayed without citation."

  - id: ell-057
    finding: "François Bouet states, in an August 2026 manuscript, that search engines, full-text databases and document management systems all manage text well, listing storage, indexing, versioning and retrieval as the properties they handle."
    quote: "Search engines, full-text databases, and document management systems all manage text well: stored, indexed, versioned, retrieved."
    source: essay-2026-08-19
