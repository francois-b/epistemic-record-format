    source_quality: high

  - id: ell-142
    finding: "Notion's help documentation states that when a page's verification expires the owner is notified to re-verify it, which is the lapse behaviour the essay attributes to Notion and Guru alike."
    quote: "Once verification expires, page owners will be notified to re-verify the page."
    source: notion-verified-pages
    source_quality: high

  # ---- The company-brain trend ----

  - id: ell-143
    finding: "Y Combinator's Summer 2026 Requests for Startups, as captured by the Internet Archive on 29 May 2026, carries a Company Brain entry written by Tom Blomfield, which confirms the essay's attribution of the phrase to a YC request for startups for that batch."
