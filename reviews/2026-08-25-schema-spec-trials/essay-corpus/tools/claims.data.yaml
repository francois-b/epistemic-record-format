  - id: company-brain-was-a-yc-request-for-startups-for-summer-2026
    title: "\"Company Brain\" was a Y Combinator request for startups in the Summer 2026 batch, written by Tom Blomfield"
    epistemic_kind: observation
    short_name: "the YC RFS"
