  - id: grounded-material-lowers-hallucination-risk-downstream
    title: "Material that keeps its sources and its epistemic kind can be fed into further LLM calls with less risk of hallucination than loose prose"
    epistemic_kind: observation
    short_name: "grounding helps"
    semantic_query: "providing verbatim sourced evidence to a language model reduces hallucination compared to unstructured prose measurement"
    families: [diagnosis]
    atoms_for: [ell-044]
    body: |
      ## Working notes

      The mechanism the whole proposal depends on, and the corpus could not
      back it. No measurement comparing grounded, typed material against loose
      prose as LLM input was sought or found. The claim-checking tools this
      corpus records presuppose that grounding helps rather than demonstrating
      it. Listed in README.md, and it is the assertion whose backing would be
      worth the most to the essay.

  # ============================= Arguments =============================

  - id: disciplines-form-around-mechanical-primitives
    title: "A working discipline forms only once its primitives are mechanical, which is why code review formed around the diff and continuous integration around tests, and why no comparable discipline has crystallized in knowledge work"
    epistemic_kind: argument
    short_name: "primitives first"
    semantic_query: "mechanical primitive precedes practice formation software engineering discipline diff tests"
    families: [thesis]
    atoms_for: [ell-017]
    edges:
      - to: knowledge-work-lacks-the-three-mechanical-primitives
        relation: assumes
      - to: continuous-integration-formed-around-automated-tests
        relation: assumes
      - to: code-review-formed-around-diff
        relation: assumes
    body: |
      ## Working notes

      The essay's central argument. Granting the premises the conclusion
      follows, and the premises are in trouble: one is unbacked (code review
      and the diff), and the third is decomposed into three parts of which two
      are false as written.

      The argument also has a form problem the corpus cannot settle: two
      confirming instances from one field, both selected after the conclusion
      was formed. A reader who wanted to attack this would ask for a
      discipline that formed without a mechanical primitive, and would find
      several outside software.

  - id: an-epistemic-layer-is-missing-from-knowledge-work-tooling
    title: "Knowledge work in the LLM era needs a layer that tracks provenance, checking and standing, and that layer is not present in mainstream tooling"
    epistemic_kind: argument
    short_name: "the missing layer"
    semantic_query: "missing epistemic layer over knowledge work tooling provenance verification endorsement not mainstream"
    families: [thesis]
    atoms_for: [ell-005]
    edges:
      - to: mainstream-tools-file-text-by-subject-format-author-and-date
        relation: assumes
      - to: no-tool-adds-checked-provenance-claim-checking-or-standing
        relation: assumes
      - to: no-tool-records-human-versus-ai-authorship
        relation: assumes
      - to: recording-human-judgment-has-next-to-no-tooling
        relation: assumes
    body: |
      ## Working notes

      The document's thesis. Three of its four premises are false as the essay
      states them and true in a narrower form; the argument survives the
      narrowing, because "not present in mainstream tooling" is weaker than
      "nobody has built it" and is what the premises actually support.

      The honest restatement: these primitives exist, in scholarly publishing,
      in fact-checking, in RAG evaluation and in media provenance, and none of
      them has reached general knowledge work. That is a claim about adoption
      rather than about invention, and it is a better claim.

  - id: page-grain-explains-the-three-absences
    title: "Company-brain products are missing grounding, endorsement and attribution because their unit is the page or the chunk rather than the claim"
    epistemic_kind: argument
    short_name: "page grain"
    semantic_query: "chunk or page as retrieval unit explains absence of claim level verification endorsement attribution"
    families: [company-brain]
    atoms_for: [ell-039]
    edges:
      - to: company-brain-products-ship-permission-aware-retrieval-with-agents
        relation: assumes
      - to: company-brain-citations-are-not-checked
        relation: assumes
      - to: notion-and-guru-verify-whole-pages-and-let-them-lapse
        relation: assumes
      - to: nothing-records-authorship-below-the-grain-of-a-whole-page
        relation: assumes
    body: |
      ## Working notes

      The best argument in the essay: it explains three separate observations
      with one structural cause rather than listing them. The page-verification
      premise is well backed by both vendors' own documentation. The
      authorship premise is false as stated, which weakens the third leg
      without touching the mechanism.

  - id: company-brain-names-no-mechanism
    title: "The phrase \"company brain\" anthropomorphizes and specifies nothing"
    epistemic_kind: argument
    short_name: "brain names nothing"
    semantic_query: "anthropomorphic product naming without mechanism enterprise brain company brain marketing term"
    families: [company-brain]
    atoms_for: [ell-038]
    edges:
      - to: company-brain-was-a-yc-request-for-startups-for-summer-2026
        relation: assumes
      - to: company-brain-products-ship-permission-aware-retrieval-with-agents
        relation: assumes
    body: |
      ## Working notes

      The premise the essay cites cuts against the conclusion. The Y Combinator
      entry it points to names a pipeline, states what the thing is not ("not a
      company-wide search or a chatbot over documents"), and gives a target
      artefact (an executable skills file). The word anthropomorphizes; the
      request for startups behind it is specific.

      The argument survives only if it is about the word as used in the
      market rather than about the source the essay cites, and the essay does
      not make that distinction.

  - id: without-attribution-past-verdicts-cannot-be-separated
    title: "Without a record of authorship at a fine grain, an operator cannot later separate the verdicts they adjudicated themselves from the ones an LLM supplied"
    epistemic_kind: argument
    short_name: "verdict amnesia"
    semantic_query: "distinguishing human adjudicated judgments from AI supplied ones after the fact authorship record"
    families: [thesis]
    atoms_for: [ell-008]
    edges:
      - to: no-tool-records-human-versus-ai-authorship
        relation: assumes
    body: |
      ## Working notes

      Granting the premise the conclusion follows immediately. The premise is
      false as a universal, so the argument's real force is conditional: where
      no such record is kept, the amnesia follows. That is enough for the
      essay's purposes and less than it claims.

  - id: checks-mechanize-in-the-order-syntactic-semantic-pragmatic
    title: "Syntactic checks mechanize reliably, semantic checks partially, and pragmatic checks least, so a system that wants mechanical guarantees should build on syntactic primitives first"
    epistemic_kind: argument
    short_name: "check gradient"
    semantic_query: "reliability of automating string level checks versus meaning level versus purpose dependent judgment"
    families: [thesis]
    atoms_for: [ell-026]
    edges:
      - to: three-kinds-of-check-are-distinct
        relation: assumes
    body: |
      ## Working notes

      Corroborated sideways by what the corpus found: the shipped claim
      checkers are all syntactic in their plumbing and LLM-judged in their
      verdicts, which is exactly "semantic checks mechanize partially" observed
      in the field. Nothing found bears on the pragmatic end.

  - id: unstructured-prose-defeats-checking
    title: "Handing unstructured prose to an LLM produces automation in which nothing in particular is being checked, because there is no unit for a check to attach to"
    epistemic_kind: argument
    short_name: "woolly ball"
    semantic_query: "unstructured prose input to LLM pipeline nothing verifiable no unit of verification"
    families: [thesis]
    atoms_for: [ell-027]
    edges:
      - to: checks-mechanize-in-the-order-syntactic-semantic-pragmatic
        relation: assumes
    body: |
      ## Working notes

      An argument resting on an argument, which the format allows so long as
      the chain ends somewhere that is not one. It ends at the three-kinds-of-
      check stipulation.

      A reader could object that the claim-checking tools this corpus records
      take unstructured prose as input and impose the unit themselves, by
      decomposing a response into claims. That is a real objection and the
      essay does not answer it.

  - id: separability-improves-the-odds-of-adoption
    title: "Keeping the pieces separately adoptable improves the odds of adoption, because a single system that must be taken whole is one nobody adopts"
    epistemic_kind: argument
    short_name: "separability pays"
    semantic_query: "modular adoption path versus monolithic system adoption failure knowledge tools"
    families: [thesis]
    atoms_for: [ell-028]
    edges:
      - to: successful-saas-picked-a-use-case-with-workflow-constraints
        relation: assumes
    body: |
      ## Working notes

      Its premise is unbacked, and there is a counter-argument the essay does
      not face: the successful SaaS products it cites succeeded by being taken
      whole, with their constraints, which is the opposite lesson.

  - id: sharing-requires-semantic-and-pragmatic-interoperability
    title: "Two people sharing this kind of corpus need a source, a verified claim and a ruling to mean the same thing on both sides, and need the same standard of care applied at capture, which must be agreed before the data is captured rather than converted afterwards"
    epistemic_kind: argument
    short_name: "sharing needs agreement"
    semantic_query: "semantic and pragmatic interoperability prerequisite for exchanging evidence and rulings between people"
    families: [thesis]
    atoms_for: [ell-015, ell-016]
    edges:
      - to: pragmatic-interoperability-is-an-established-term
        relation: assumes
      - to: the-approach-is-untested-beyond-one-person
        relation: assumes
    body: |
      ## Working notes

      The essay flags this as unresolved and the corpus agrees: it is an
      argument from definitions, with no instance behind it, about a case the
      author has never run.

  - id: the-one-operator-evidence-base-bounds-every-claim
    title: "Every proposal in this document is evidenced by a single six-month, one-operator deployment of about 500 atoms, which bounds how far any of it can be asserted"
    epistemic_kind: argument
    short_name: "n equals one"
    semantic_query: "single case evidence base limits generalization of a proposed system"
    families: [evidence-base]
    atoms_for: [ell-014, ell-035]
    edges:
      - to: author-system-holds-500-atoms-one-operator-six-months
        relation: assumes
      - to: the-approach-is-untested-beyond-one-person
        relation: assumes
    body: |
      ## Working notes

      Not an argument the essay makes; an argument the corpus makes from the
      essay's own two admissions, because the top-down pass kept arriving at
      it. The author states both premises plainly and then writes in the
      register of a general diagnosis. That gap is the largest single thing a
      hostile reader would attack, and it is fixable by tone rather than by
      evidence.

  - id: general-primitives-fail-on-the-specific-versus-open-tension
    title: "General-purpose knowledge-work primitives fail because one tool cannot be both specific enough to be efficient and open enough for a great variety of workflows"
    epistemic_kind: argument
    short_name: "the general-tool trap"
    semantic_query: "tension between specificity and generality in knowledge tools cause of repeated failure"
    families: [diagnosis]
    atoms_for: [ell-019]
    body: |
      ## Working notes

      Its premises arrive from the other direction, as incoming supports:
      the repeated-failure observation and the constrained-SaaS observation.
      The diagnosis is plausible and the two supporting observations are thin,
      one being backed by two famous failures and the other by nothing.

  # =============================== Bets ===============================

  - id: knowledge-work-gets-its-own-agile
    title: "If LLMs make it possible to operate quickly on knowledge, knowledge work will get its own round of new or renewed methodologies, probably resembling the original Agile field"
    epistemic_kind: bet
    short_name: "an Agile for knowledge work"
    semantic_query: "new methodologies for knowledge work emerging from faster iteration analogous to agile software"
    families: [forecast]
    atoms_for: [ell-037]
    body: |
      ## Working notes

      What would settle it: a named methodology for non-coding knowledge work,
      with published practices and more than one organization using it, by
      2029. Recorded here because the format's only slot for a bet's
      resolution criterion is the `why` of a standing entry, which an LLM must
      not write. See friction-log.md F-12.

      The bet's motor is the analogy, and the analogy is in trouble: the
      primary account of Agile's origin gives heavyweight process and shared
      values as the cause, not iteration speed.

  - id: records-and-disciplines-outlast-any-particular-llm
    title: "Records, disciplines and surfaces built on the right primitives outlast any particular LLM, and each new LLM makes them more useful"
    epistemic_kind: bet
    short_name: "durability"
    semantic_query: "durability of structured knowledge records across successive model generations increasing usefulness"
    families: [forecast]
    atoms_for: [ell-024]
    body: |
      ## Working notes

      What would settle it: the same corpus, unchanged in format, in
      productive use across at least two model generations that break other
      tooling, with the operator reporting increased rather than decreased
      usefulness. Two model generations is about eighteen months at the
      current cadence.

  - id: llm-economics-remove-the-labour-that-sank-km
    title: "LLMs remove most of the manual labour that made 1990s knowledge management unscalable, which is what makes the field worth reviving now"
    epistemic_kind: bet
    short_name: "the second chance"
    semantic_query: "LLM automation of knowledge curation removing the maintenance cost that defeated earlier knowledge management"
    families: [forecast]
    atoms_for: [ell-043]
    body: |
      ## Working notes

      The premise it leans on, that manual maintenance is what sank 1990s
      knowledge management, is itself unbacked in this corpus.

      What would settle it: a knowledge corpus of comparable ambition
      maintained at a labour cost per record an order of magnitude below the
      1990s baseline, with the baseline stated. Nobody has stated the baseline.

  - id: the-workspace-governance-layer-is-where-the-value-is
    title: "Adding governance over LLM use and over the operator's own workflows is where most of the value of this approach lies"
    epistemic_kind: bet
    short_name: "governance is the value"
    semantic_query: "value of constraining LLM output with document contracts and workflow rules relative to other components"
    families: [forecast]
    atoms_for: [ell-033]
    body: |
      ## Working notes

      A bet rather than an observation because "most of the value" is a
      comparison across components that no one has measured, in a deployment of
      one. What would settle it: the same operator, or another, running the
      grounding and attribution layers without the governance layer, and
      reporting which loss hurts more.

  - id: agentic-marketing-outruns-its-substrate
    title: "Agentic AI is being marketed while much of the structure that would have to sit underneath it is underserved, and non-deterministic workflows need a quality of structure that has not had time to emerge outside coding"
    epistemic_kind: observation
    short_name: "top of the stack"
    semantic_query: "agentic AI marketing outpacing underlying data and verification infrastructure non-deterministic workflow reliability"
    families: [diagnosis]
    atoms_for: [ell-040]
    body: |
      ## Working notes

      Backed only by the essay. No market or product survey of agentic
      offerings was run, and "underserved" is a comparative judgment that would
      need one. Recorded as unbacked.
