      One vendor page was retrieved for a claim the essay makes about every
      product in the category ("unpack any of them"). Glean corroborates the
      permission-aware and observability half. No product survey was run and
      none is claimed; this is the weakest evidence-to-scope ratio of any
      claim in the corpus that has any evidence at all.

  - id: company-brain-citations-are-not-checked
    title: "In company-brain products, citations point at a page or highlight a passage on screen, and where a quote is kept nothing checks it"
    epistemic_kind: observation
    short_name: "unchecked citations"
    semantic_query: "enterprise AI assistant citation verification quotation checked against source document highlight"
