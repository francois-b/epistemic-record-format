# Claims. Every claim in this corpus is a proposal: no `standings` entry is
# written anywhere, because only a person takes a stance (ERF-21) and the
# author has not ruled. The builder writes the title verbatim as the first line
# of each body (ERF-18) and the working notes follow it.
claims:

  # ============================ Commitments ============================
  # The essay's own design decisions. `commitment` owes no backing: the
  # author's decision is the backing (section 5), so these carry the essay's
  # own words and nothing else.

  - id: scope-excludes-coding
    title: "This document's subject is knowledge work outside coding: researching a topic, synthesizing sources, producing documents, and keeping order over accumulated information, with coding deliberately excluded"
    epistemic_kind: commitment
    short_name: "scope"
    semantic_query: "definition of knowledge work excluding software development, research synthesis document production information management"
    families: [scope]
    atoms_for: [ell-002, ell-003]
    body: |
      ## Working notes

      A stipulation, not a proposition about the world, which is why it is a
      commitment. It matters downstream: every universal negative in the essay
      is to be read as scoped to non-coding knowledge work, and several of the
      counterexamples this corpus records (Cursor Blame, agentblame, argument
      notations aimed at programmers) sit on or across that line. Where a
      counterexample comes from coding, the claim it cuts against says so.

  - id: file-text-by-epistemic-type
    title: "Knowledge-work tools should file text by epistemic type, distinguishing a captured source, a verified fact, an asserted claim, an argument over claims, a position held, an open question, and a ruling"
    epistemic_kind: commitment
    short_name: "epistemic types"
    semantic_query: "typed knowledge units source claim argument question ruling distinguished by what backs them"
    families: [proposal]
    atoms_for: [ell-006]
    body: |
      ## Working notes

      Seven types are asserted as different things. The corpus records that at
      least three of the seven (source, claim, argument) are typed in existing
      systems (nanopublications, Discourse Graphs, argument maps); the ruling
      and the position held were found nowhere.

  - id: atom-is-one-quote-from-one-source
    title: "The unit of evidence should be one verbatim quote from one source, small enough to support a single point, carrying its link, its retrieval metadata and enough context to be used away from the source"
    epistemic_kind: commitment
    short_name: "the atom"
    semantic_query: "evidence unit single verbatim quotation with source link retrieval date and surrounding context"
    families: [proposal]
    atoms_for: [ell-007, ell-029]
    body: |
      ## Working notes

      The commitment is to granularity and to self-sufficiency away from the
      source. Nanopublications make the same granularity choice at the level of
      an RDF assertion rather than a quotation, which is the nearest prior art
      and is a difference worth the author's attention rather than a refutation.

  - id: standing-is-operator-only-and-dated
    title: "Each claim should carry a standing that only the operator moves, with every move dated in the file's history so that a withdrawal is a recorded event rather than a deletion"
    epistemic_kind: commitment
    short_name: "standing"
    semantic_query: "dated per-person endorsement ledger on a claim with withdrawal recorded as an event not a deletion"
    families: [proposal]
    atoms_for: [ell-031, ell-032]
    body: |
      ## Working notes

      This is the one of the essay's three named properties for which the
      opposite search found nothing at all. Notion and Guru mark whole pages
      and let them lapse; Kialo records ratings without dating them per person;
      ADRs record a decision once and never revisit it. A dated, per-person,
      withdrawable position on a claim was not found in any system this corpus
      reached.

  - id: tools-must-not-create-chores-of-their-own
    title: "Knowledge-work tools should bring the material a task needs in the form the operator needs it, and should never create chores of their own such as correcting the AI's mistakes or re-checking what has already been verified"
    epistemic_kind: commitment
    short_name: "no new chores"
    semantic_query: "tool design principle avoid generating maintenance work for the user attention protection"
    families: [proposal]
    atoms_for: [ell-010]
    body: |
      ## Working notes

      Stated as a design constraint the author holds himself to. It is in
      tension with the essay's own governance finding, which is that the value
      came from adding constraints, and constraints are chores until they pay.

  - id: pieces-must-be-separately-adoptable
    title: "The pieces of the proposed system should each be adoptable on their own, following the Unix habit of small tools that do one thing and compose"
    epistemic_kind: commitment
    short_name: "separability"
    semantic_query: "modular composable tools each adoptable independently unix philosophy small tools"
    families: [proposal]
    atoms_for: [ell-028]
    body: |
      ## Working notes

      A design decision the essay states as such, with an adoption rationale
      attached. The rationale is a separate claim and is argued rather than
      asserted here.

  - id: epistemology-means-tracking-provenance-and-trust
    title: "In this document epistemology means tracking provenance and trust to the point where a written assertion can be relied on, with claims pointing to sources, arguments pointing to claims, and both recording who stands behind them"
    epistemic_kind: commitment
    short_name: "epistemology, here"
    semantic_query: "provenance and trust tracking so a written assertion can be relied upon claims sources arguments endorsement"
    families: [scope]
    atoms_for: [ell-004]
    body: |
      ## Working notes

      A stipulative definition. It is the hinge of the document: everything
      after it is offered as an instance of this definition.

  - id: knowledge-is-text-you-can-check-combine-and-stand-behind
    title: "Knowledge, for this document's purposes, is text a person can check, combine and stand behind, as distinct from text that is merely stored, indexed, versioned and retrieved"
    epistemic_kind: commitment
    short_name: "knowledge vs text"
    semantic_query: "distinction between managing text and managing knowledge checkable combinable endorsable"
    families: [scope]
    atoms_for: [ell-036]
    body: |
      ## Working notes

      The definition does real work: the essay's whole diagnosis of prior
      systems follows from taking these three properties as constitutive.

  - id: three-kinds-of-check-are-distinct
    title: "Checks come in three distinct kinds: a syntactic check reads only the text, a semantic check reads its meaning, and a pragmatic check depends on the interpreter and the purpose"
    epistemic_kind: commitment
    short_name: "three checks"
    semantic_query: "syntactic semantic pragmatic distinction applied to verification of quotations and claims"
    families: [scope]
    atoms_for: [ell-025]
    body: |
      ## Working notes

      A stipulation borrowed from linguistics, and the essay flags in its
      glossary that pragmatic carries the linguistic sense. The three-way split
      is the frame for the mechanization claim, which is separate.

  - id: entailment-is-the-cold-reader-test
    title: "Entailment, for this document's purposes, is whether a reader holding only the quote and its surrounding context would accept the claim that cites it"
    epistemic_kind: commitment
    short_name: "entailment"
    semantic_query: "entailment test does the quotation support the claim for a reader holding only the quotation"
    families: [scope]
    atoms_for: [ell-041]
    body: |
      ## Working notes

      Worth recording separately because it is the operational definition on
      which the whole grounding proposal depends, and because the shipped
      claim-checking systems this corpus records (Google's check grounding API,
      Ragas, TruLens) all implement a version of it with an LLM as the reader.

  # ==================== First-party observations ====================

  - id: author-system-holds-500-atoms-one-operator-six-months
    title: "The author's own system held more than 500 atoms, with one operator, after about six months, and he does not know how the approach breaks at larger scale"
    epistemic_kind: observation
    short_name: "the deployment"
    semantic_query: "personal knowledge system scale five hundred evidence units single operator six months"
    families: [evidence-base]
    atoms_for: [ell-035]
    body: |
      ## Working notes

      The whole evidence base for the essay's proposals. It is stated plainly
      by the author, including the limit, which is to his credit and is also the
      reason the corpus grades every proposal claim as untested at scale.

  - id: author-built-a-save-time-authorship-shadow-record
    title: "The author built a shadow record that commits at every file save with who made the change, person or AI"
    epistemic_kind: observation
    short_name: "shadow record"
    semantic_query: "per-save authorship record committing human or AI attribution across a working corpus"
    families: [evidence-base]
    atoms_for: [ell-030]
    body: |
      ## Working notes

      First-party and only first-party: nothing outside the essay evidences
      this system's existence or behaviour, and nothing could without access to
      it. It is recorded because the essay's attribution argument rests on it
      being possible, and the essay is the only witness that it is.

  - id: governance-was-where-most-of-the-value-turned-out-to-be
    title: "In the author's own practice, adding governance over LLM use and over his own workflows was where most of the value turned out to be, and he had underestimated how much constraint was needed"
    epistemic_kind: observation
    short_name: "governance paid"
    semantic_query: "constraints on LLM output document contracts produced most of the value in practice"
    families: [evidence-base]
    atoms_for: [ell-033]
    body: |
      ## Working notes

      A first-party report about one operator's experience, offered as the
      lesson of the essay's third section. Nothing outside the essay bears on
      it and it is not the kind of claim an outside source could settle.

  - id: llm-fit-sharpened-the-authors-document-thinking
    title: "Shaping a workflow to suit an LLM sharpened the author's own thinking about the kinds of document he works on"
    epistemic_kind: observation
    short_name: "LLM fit sharpens"
    semantic_query: "specifying document types for an LLM improves the author's own clarity about document purpose"
    families: [evidence-base]
    atoms_for: [ell-034]
    body: |
      ## Working notes

      A first-party observation, and one of the essay's more interesting
      side-claims. It generalizes badly on one data point and is recorded as
      what it is.

  - id: the-approach-is-untested-beyond-one-person
    title: "Everything the document proposes has been tested only within a one-person setup, and how it would be shared between people is unresolved"
    epistemic_kind: observation
    short_name: "one operator only"
    semantic_query: "single-user validation of a knowledge system multi-user sharing unresolved"
    families: [evidence-base]
    atoms_for: [ell-014]
    body: |
      ## Working notes

      The author states this himself. It is the premise of the strongest
      argument against the essay, which is that its confidence and its evidence
      base are not the same size.

  # =================== Observations about the world ===================

  - id: ai-tooling-is-further-along-for-coding-than-for-knowledge-work
    title: "AI assistance is substantially further developed for software coding than for the wider spectrum of knowledge work"
    epistemic_kind: observation
    short_name: "coding is ahead"
    semantic_query: "maturity comparison AI tooling software development versus general knowledge work research writing"
    families: [diagnosis]
    atoms_for: [ell-001]
    body: |
      ## Working notes

      Backed only by the essay's own assertion. No comparative measure of
      tooling maturity across the two domains was sought or found, and the
      claim is a comparative one, so it would need one. Listed in README.md
      among the assertions this corpus could not back.

  - id: mainstream-tools-file-text-by-subject-format-author-and-date
    title: "Mainstream knowledge-work tools file text by subject, format, author and date, and not by what stands behind it"
    epistemic_kind: observation
    short_name: "filing axes"
    semantic_query: "document management taxonomy metadata subject format author date not provenance or verification status"
    families: [diagnosis]
    atoms_for: [ell-046]
    atoms_against: [ell-115, ell-118, ell-123]
    surveys: [provenance-and-claim-primitives-2026-08-25]
    body: |
      ## Working notes

      True of the mass-market tools the essay has in mind and false as a
      statement about available systems: Schema.org ClaimReview files by
      fact-check verdict, nanopublications file by assertion with provenance,
      Discourse Graphs file by claim, evidence and question. The word
      "mainstream" is carrying the claim, and it is not defined.

  - id: trust-tracking-is-confined-to-niches-and-done-by-hand
    title: "How far a piece of text can be trusted has been tracked only in niches, and by hand: in legal citators, in source grading for intelligence work, and in peer review"
    epistemic_kind: observation
    short_name: "trust in niches"
    semantic_query: "source reliability grading practices legal citators intelligence source evaluation peer review manual"
    families: [diagnosis]
    atoms_for: [ell-047]
    atoms_against: [ell-152, ell-153, ell-115, ell-116]
    surveys: [provenance-and-claim-primitives-2026-08-25]
    edges:
      - to: intelligence-source-grading-is-a-codified-two-axis-standard
        relation: conflicts-with
    body: |
      ## Working notes

      Two assertions travel in one sentence. The niche half is defensible. The
      by-hand half is not: the Admiralty code is a published two-axis notation
      used across NATO, Schema.org ClaimReview is a machine-readable
      interchange vocabulary, and Scite classifies citations at scale. The
      author would need to drop "by hand" or say what he means by it.

      No source was retrieved for the legal-citator half of the sentence, and
      the automation of citator treatment flags is the place a reader would
      press hardest. Recorded as partially unbacked.

  - id: intelligence-source-grading-is-a-codified-two-axis-standard
    title: "Source grading for intelligence work is a codified two-character standard, the Admiralty or NATO system, which grades source reliability and information credibility on separate axes so that one does not contaminate the other"
    epistemic_kind: observation
    short_name: "Admiralty code"
    semantic_query: "Admiralty NATO source reliability credibility two character notation A1 F6 intelligence evaluation"
    families: [prior-art]
    atoms_for: [ell-152, ell-153]
    body: |
      ## Working notes

      Recorded as its own claim because it is a fact about the world with
      standing independent of the essay, and because the separation-of-axes
      rule is a design lesson the essay's own grading proposal does not
      address. It stands in tension with the by-hand half of the niche claim
      and the tension is stored there.

  - id: km-1990s-failed-on-the-cost-of-manual-maintenance
    title: "Knowledge management was attempted in the 1990s and the manual work of building and maintaining it created too much friction for it to scale"
    epistemic_kind: observation
    short_name: "KM's first failure"
    semantic_query: "1990s knowledge management programmes failure rate maintenance burden taxonomy curation abandoned"
    families: [history]
    atoms_for: [ell-042]
    body: |
      ## Working notes

      Backed only by the essay. No history of 1990s knowledge management was
      searched or retrieved, and this is the load the essay's whole
      second-chance argument rests on. Listed in README.md among the assertions
      this corpus could not back, and it is the one most worth backing.

  - id: pkm-is-broadly-manual-work
    title: "Building, curating and using personal knowledge management systems is manual work, and that is broadly the state of the field"
    epistemic_kind: observation
    short_name: "PKM is manual"
    semantic_query: "personal knowledge management note-taking systems manual curation maintenance burden"
    families: [diagnosis]
    atoms_for: [ell-021]
    body: |
      ## Working notes

      Backed only by the essay. Not searched: the LLM-native note tools that
      have appeared since 2023 are the obvious place a counterexample would
      sit, and no act in this corpus went looking. Recorded as unbacked.

  - id: crm-decays-because-it-must-be-maintained-by-hand
    title: "A CRM has to be maintained by hand and decays because of it"
    epistemic_kind: observation
    short_name: "CRM decay"
    semantic_query: "CRM data quality decay rate cause manual entry maintenance contact records"
    families: [diagnosis]
    atoms_for: [ell-053]
    atoms_against: [ell-162, ell-163]
    surveys: [knowledge-store-decay-rates-2026-08-25]
    body: |
      ## Working notes

      The decay is real and measured, in the 22 to 70 percent a year range,
      but every figure comes from a company selling the remedy. More
      importantly the mechanism is wrong: the sources attribute decay to job
      changes and email churn, which is the world moving under a record that
      was correct when written, not to a record nobody maintained. The essay's
      causal claim and the literature's causal claim are different claims.

  - id: enterprise-wikis-go-stale-and-are-cleaned-up-or-abandoned
    title: "Enterprise wikis such as Confluence and SharePoint go stale until people either mount a big clean-up or drop them entirely"
    epistemic_kind: observation
    short_name: "wikis go stale"
    semantic_query: "enterprise wiki content staleness Confluence SharePoint abandonment content sprawl audit"
    families: [diagnosis]
    atoms_for: [ell-054, ell-165, ell-141, ell-142, ell-164]
    surveys: [knowledge-store-decay-rates-2026-08-25]
    body: |
      ## Working notes

      Better backed than the CRM claim and by a sideways route: two vendors,
      Notion and Guru, have built verification with expiry and re-notification,
      which is machinery you build when staleness is the default state. Guru
      puts a number on it, saying manual verification reaches 8 to 12 percent
      of organizational content. That number is the vendor's own and no method
      is given for it.

      Nothing was retrieved about Confluence or SharePoint specifically, which
      are the two products the essay names.

  - id: successful-saas-picked-a-use-case-with-workflow-constraints
    title: "The SaaS products that succeeded in knowledge work picked one use case together with workflow constraints, and frustrate users for that very reason"
    epistemic_kind: observation
    short_name: "constrained SaaS wins"
    semantic_query: "successful productivity SaaS narrow use case opinionated workflow constraints user frustration"
    families: [diagnosis]
    atoms_for: [ell-020]
    body: |
      ## Working notes

      Backed only by the essay, and it is a claim about a whole product
      category with no product named. Recorded as unbacked.

  - id: general-purpose-knowledge-primitives-have-repeatedly-failed
    title: "Primitives for knowledge work in general have failed repeatedly"
    epistemic_kind: observation
    short_name: "general primitives fail"
    semantic_query: "history of failed general purpose knowledge representation hypertext semantic web unrealized"
    families: [history]
    atoms_for: [ell-019, ell-150, ell-151]
    edges:
      - to: general-primitives-fail-on-the-specific-versus-open-tension
        relation: supports
    body: |
      ## Working notes

      Two instances retrieved: Project Xanadu, which Wired called the
      longest-running vaporware story in the industry, and the Semantic Web,
      whose own originators said in 2006 that the idea remained largely
      unrealized. Two instances are not a pattern; they are the two everyone
      already names. A reader could fairly ask which general-purpose primitives
      succeeded and whether the essay's sample is chosen by its conclusion.

  - id: knowledge-work-lacks-the-three-mechanical-primitives
    title: "Knowledge work has no diff for arguments, no test that runs on claims as a document grows, and no lint for provenance"
    epistemic_kind: observation
    short_name: "no primitives"
    semantic_query: "missing mechanical primitives for knowledge work argument diff claim test provenance lint"
    families: [diagnosis]
    atoms_for: [ell-018]
    edges:
      - to: knowledge-work-has-no-diff-for-arguments
        relation: decomposes-into
      - to: knowledge-work-has-no-test-that-runs-on-claims
        relation: decomposes-into
      - to: knowledge-work-has-no-lint-for-provenance
        relation: decomposes-into
    body: |
      ## Working notes

      One sentence of the essay carrying three universal negatives. Decomposed
      because each part has different evidence and a different verdict, and
      because a single backing audit over the three could not answer any of
      them. Two of the three parts are false as written; the third is closest
      to true. Read the parts.

  - id: knowledge-work-has-no-diff-for-arguments
    title: "There is no diff for arguments: no mechanical primitive that shows what changed between two versions of an argument"
    epistemic_kind: observation
    short_name: "no argument diff"
    semantic_query: "compare two versions of an argument structurally argument mapping notation version control diff"
    families: [diagnosis]
    atoms_for: [ell-018]
    atoms_against: [ell-126, ell-127, ell-128, ell-129, ell-130, ell-131]
    surveys: [argument-structure-primitives-2026-08-25]
    body: |
      ## Working notes

      The most interesting near-miss in the corpus. Argument mapping is a
      field with a literature and a vocabulary; Argdown writes argument
      structure as plain text inside markdown, which a line diff handles today;
      Kialo runs claim trees at scale. And still nothing found computes or
      presents a structural difference between two versions of an argument.
      The sentence is false as written and close to true as meant, and the
      author should say the true version.

  - id: knowledge-work-has-no-test-that-runs-on-claims
    title: "There is no test that runs on claims as a document grows, in the way a test suite runs on code"
    epistemic_kind: observation
    short_name: "no claim test"
    semantic_query: "automated check over assertions in a document entailment against sources run continuously"
    families: [diagnosis]
    atoms_for: [ell-018]
    atoms_against: [ell-109, ell-110, ell-111, ell-112, ell-113, ell-114, ell-115, ell-116]
    surveys: [claim-level-checks-and-provenance-lint-2026-08-25]
    body: |
      ## Working notes

      False as written. Claim-level entailment checking is a commodity: Google
      ships an API that returns per-claim citations and a support score with a
      sub-500ms latency budget, and Ragas and TruLens both decompose a response
      into claims and check each against retrieved context.

      What survives is the phrase "as a document grows". Every instance found
      checks a generated answer against retrieved context at inference time.
      None runs over a document's own claim graph on every save, which is the
      continuous-integration shape the essay is asking for.

  - id: knowledge-work-has-no-lint-for-provenance
    title: "There is no lint for provenance: no automated check that a document's citations exist, say what they are said to say, and are themselves sound"
    epistemic_kind: observation
    short_name: "no provenance lint"
    semantic_query: "automated citation verification pipeline reference existence metadata retraction claim support lint"
    families: [diagnosis]
    atoms_for: [ell-018]
    atoms_against: [ell-117, ell-122, ell-108]
    surveys: [claim-level-checks-and-provenance-lint-2026-08-25]
    body: |
      ## Working notes

      False as written, and falsified by a tool that uses the essay's own
      word: sciwrite-lint applies the linting paradigm to citation
      verification, checks reference existence, metadata accuracy, retraction
      status and claim support, runs locally, and is fast enough to re-run
      between revisions. It is a 2026 preprint rather than an established tool,
      which is the strongest thing that can be said in the essay's defence.

  - id: memory-and-graph-tools-have-not-moved-beyond-pre-llm-work
    title: "Most of the memory, context and knowledge-graph tools available do the pre-LLM thing of storing, linking and retrieving text, and few have moved beyond it"
    epistemic_kind: observation
    short_name: "old wine"
    semantic_query: "LLM memory context knowledge graph tools novelty beyond storage linking retrieval"
    families: [diagnosis]
    atoms_for: [ell-022]
    atoms_against: [ell-138, ell-139, ell-140]
    surveys: [provenance-and-claim-primitives-2026-08-25]
    body: |
      ## Working notes

      Two counterexamples, both partial. GraphRAG has the LLM build the graph
      and the community summaries rather than storing what it was given, which
      is not a pre-LLM operation. Graphiti attaches a validity window and
      provenance to each fact, which is more than storing and linking.

      Neither checks anything, so the essay's stronger claim, that none of them
      adds a checking primitive, is untouched by these two.

  - id: no-tool-adds-checked-provenance-claim-checking-or-standing
    title: "None of the available memory, context and knowledge-graph tools adds a primitive for checked provenance, for checking claims, or for recording what a person stands behind"
    epistemic_kind: observation
    short_name: "the three absences"
    semantic_query: "tool combining verified quotation provenance claim entailment checking and dated human endorsement"
    families: [diagnosis, universal-negative]
    atoms_for: [ell-023]
    atoms_against: [ell-115, ell-116, ell-117, ell-118, ell-119, ell-120, ell-122, ell-123, ell-124, ell-109, ell-110, ell-135]
    surveys: [provenance-and-claim-primitives-2026-08-25, claim-level-checks-and-provenance-lint-2026-08-25, judgment-recording-tooling-2026-08-25]
    body: |
      ## Working notes

      This is the essay's sharpest sentence and it does not survive. Two of the
      three primitives are present in the wild and have been for over a decade.
      Checked provenance: nanopublications from 2012, SEPIO, W3C PROV,
      sciwrite-lint. Claim checking: Schema.org ClaimReview, Scite, Google's
      check grounding API. Recording what a person stands behind: nothing found
      anywhere, and the nearest relatives (ADRs, Notion and Guru page
      verification, Kialo ratings) all fail on one of dated, per-person, or
      withdrawable.

      The defensible version of the sentence is one third as long and much
      stronger: nothing records what a person stands behind, claim by claim,
      with withdrawal as an event. Three surveys back the reading and their
      coverage bounds are stated in each; none of them is a systematic review,
      so the absence half rests on thin ground even where it holds.

  - id: no-tool-records-human-versus-ai-authorship
    title: "Today's tools do not record whether a piece of work was written by a human or by an AI tool"
    epistemic_kind: observation
    short_name: "no AI attribution"
    semantic_query: "recording whether text or code was authored by a human or an AI model per line per sentence"
    families: [diagnosis, universal-negative]
    atoms_for: [ell-048]
    atoms_against: [ell-100, ell-101, ell-103, ell-104, ell-106, ell-107]
    surveys: [human-ai-authorship-attribution-2026-08-25]
    edges:
      - to: cursor-blame-marks-ai-written-lines-with-their-model
        relation: conflicts-with
    body: |
      ## Working notes

      False as a universal, and the essay refutes it itself four sentences
      later by naming Cursor Blame. The corpus adds three more: agentblame,
      Grammarly Authorship at sentence grain, and the Co-authored-by trailer
      that AI coding tools already use.

      What survives, and it is what the essay actually needs: no such record
      spans a working corpus across tools. Every instance is confined to one
      editor, one format or one vendor's app.

  - id: cursor-blame-marks-ai-written-lines-with-their-model
    title: "Cursor Blame extends git blame with AI attribution, showing which lines were AI-generated and which model produced them, on the Enterprise plan"
    epistemic_kind: observation
    short_name: "Cursor Blame"
