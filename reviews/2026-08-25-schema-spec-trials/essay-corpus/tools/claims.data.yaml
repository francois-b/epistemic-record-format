      Accurate, and the corpus adds the detail that makes the essay's point
      for it: both vendors verify a whole page, both attach an expiry, and
      neither records who stands behind which statement inside the page. The
      unit is the page, exactly as the essay says.

  - id: speech-to-text-became-ubiquitous-in-2026
    title: "Speech-to-text became ubiquitous in 2026 and was a major productivity boost"
    epistemic_kind: observation
    short_name: "STT ubiquity"
    semantic_query: "speech to text dictation adoption rate knowledge workers 2026 measurement survey"
    families: [diagnosis]
    atoms_for: [ell-055, ell-160]
    atoms_against: [ell-161]
    surveys: [speech-to-text-ubiquity-2026-2026-08-25]
    body: |
      ## Working notes

      Nothing public supports the word "ubiquitous". The only population-level
      number retrievable is about AI use generally, not dictation. A trade
      publication writing on the subject in 2026 was still asking whether the
      technology was good enough for common office use, which is not the
      language used about something ubiquitous. The class of tool is real and
      growing; the quantifier is the author's own.

  - id: the-semantic-web-vision-produced-an-unstructured-web
    title: "The web was meant to be semantic and what accumulated was unstructured, with the semantic vision remaining largely unrealized"
    epistemic_kind: observation
    short_name: "semantic web"
    semantic_query: "semantic web vision Berners-Lee unrealized adoption structured data markup share of web"
    families: [history]
    atoms_for: [ell-056, ell-150]
    body: |
      ## Working notes

      Backed by the originators' own 2006 statement that the idea remained
      largely unrealized and by a 2013 count of about four million domains
      carrying markup out of roughly 250 million. Both figures are relayed
      through an encyclopedia and are thirteen and twenty years old; schema.org
      adoption since is not addressed and would cut the other way.

  - id: knowledge-engineering-descends-to-palantirs-ontologies
    title: "Knowledge engineering of the 1980s came at knowledge from the formal side and its descendant survives in Palantir's hand-built ontologies, which work for operational data"
    epistemic_kind: observation
    short_name: "the formal line"
    semantic_query: "knowledge engineering expert systems 1980s lineage enterprise ontology operational digital twin"
    families: [history]
    atoms_for: [ell-058, ell-154, ell-155]
    body: |
      ## Working notes

      The Palantir half is corroborated by Palantir's own documentation: the
      Ontology is an operational layer, defined by mapping data sources into
      objects, properties and links. The word "hand-built" is not settled by
      that documentation, which says the mapping happens without saying who or
      what performs it. The 1980s lineage claim is backed by nothing here.

  - id: agile-began-when-software-iteration-got-faster
    title: "Faster iteration on software is what prompted the new methodologies that became Agile"
    epistemic_kind: observation
    short_name: "Agile's cause"
    semantic_query: "origins of agile software development 2001 Snowbird motivation lightweight methods causes"
    families: [history]
    atoms_for: [ell-060]
    atoms_against: [ell-146, ell-147, ell-148]
    body: |
      ## Working notes

      The primary account gives a different cause. Highsmith, who was in the
      room, says the participants convened out of a shared need for an
      alternative to documentation-driven, heavyweight processes, and locates
      the deeper theme in a set of values about people and collaboration.
      Nothing in the account attributes the movement to iteration having become
      faster.

      This matters beyond the history: the essay's forward bet is that LLMs
      making knowledge work faster will produce an Agile-shaped methodological
      wave. If speed was not what produced Agile, the analogy loses its motor.

  - id: continuous-integration-formed-around-automated-tests
    title: "Continuous integration formed around automated tests: an automated build including test is what verifies each integration, and is constitutive of the practice rather than incidental to it"
    epistemic_kind: observation
    short_name: "CI and tests"
    semantic_query: "continuous integration definition automated build verification test practice formation"
    families: [prior-art]
    atoms_for: [ell-149]
    body: |
      ## Working notes

      Backed by the practice's principal documenter, whose definition makes
      automated verification part of what the practice is. This is the strongest
      single piece of support for the essay's mechanical-primitives thesis.

  - id: code-review-formed-around-diff
    title: "Code review as a working discipline formed around the diff"
    epistemic_kind: observation
    short_name: "review and diff"
    semantic_query: "history of code review practice diff based review tooling origins"
    families: [prior-art]
    body: |
      ## Working notes

      No search was run for this and no source backs it. It is recorded
      unbacked, and deliberately: it is one of the two premises of the essay's
      central argument, it is the half of the pair that everyone accepts
      without checking, and a corpus that quietly omitted it would be
      flattering the argument. Listed in README.md.

  - id: the-workspace-layer-is-absent-from-ai-governance
    title: "The workspace layer of governance, the working environment of files, folders, workflows and lifecycle states treated as governed data, is missing from the AI-governance conversation and from what companies outside regulated industries are doing"
    epistemic_kind: observation
    short_name: "workspace layer"
    semantic_query: "AI governance covering the operator's own file tree document classes lifecycle constraining what an LLM may create"
    families: [diagnosis, universal-negative]
    atoms_for: [ell-013, ell-012]
    atoms_against: [ell-158, ell-159]
    surveys: [workspace-layer-ai-governance-2026-08-25]
    body: |
      ## Working notes

      The one universal negative in the essay that survived its opposite
      search. Nine results, none addressing the operator's own file tree as the
      governed object. The two substantial instruments retrieved, Microsoft
      Purview and the NIST framework, both sit in the operating and data layers
      and are therefore consistent with the claim rather than against it; they
      are filed as atoms_against because a reader could reasonably say they are
      what an AI-governance conversation about the workspace would look like,
      and the claim should have to face them.

      The survey's own coverage bound is the honest caveat: the concept has no
      settled name, so a single phrasing is the weakest instrument for an
      absence.

  - id: recording-human-judgment-has-next-to-no-tooling
    title: "Recording human judgment is the newest of these practices, few people think about it, and there is next to no tooling for it"
    epistemic_kind: observation
    short_name: "no judgment tooling"
    semantic_query: "tools for recording a person's judgment position rationale dated withdrawable on a claim"
    families: [diagnosis, universal-negative]
    atoms_for: [ell-009]
    atoms_against: [ell-132, ell-133, ell-134, ell-135, ell-128]
    surveys: [judgment-recording-tooling-2026-08-25]
    body: |
      ## Working notes

      "Next to no tooling" does not survive: architecture decision records
      are a fifteen-year-old practice with a founding text, command-line tools,
      a GitHub organization, format variants, and an explicit extension to any
      decision record.

      "Newest practice" does not survive either, on the same evidence.

      What survives is narrower and is the thing worth saying: an ADR records
      a decision once, in prose, and nothing revisits it. A dated, per-person,
      withdrawable position on a claim was found nowhere.

  - id: pragmatic-interoperability-is-an-established-term
    title: "Pragmatic interoperability is an established term in the interoperability literature, meaning that two parties apply the same standard of care when they capture and use data"
    epistemic_kind: observation
    short_name: "pragmatic interop"
    semantic_query: "pragmatic interoperability levels of conceptual interoperability model definition literature"
    families: [prior-art]
    atoms_for: [ell-016]
    body: |
      ## Working notes

      Backed only by the essay's own attribution to "the literature". No
      source from that literature was retrieved. The term is checkable in one
      search and no search was run, which is an omission of this corpus rather
      than of the essay. Listed in README.md.

  - id: recycled-llm-prose-degrades-quickly
    title: "Loose AI-flavoured prose, recycled from call to call, degrades quickly"
    epistemic_kind: observation
    short_name: "prose degrades"
    semantic_query: "iterative LLM rewriting of the same text quality degradation homogenization across successive calls"
    families: [diagnosis]
    atoms_for: [ell-045, ell-166, ell-167]
    atoms_against: [ell-157]
    surveys: [llm-output-reuse-degradation-2026-08-25]
    body: |
      ## Working notes

      The nearest measured phenomenon is convergence in LLM-driven mutation
      chains: 93 percent of mutations revisiting a previously seen structural
      form in 87 percent of chains, and a classical operator not converging
      comparably. That is the essay's mechanism, measured on programs in a
      domain-specific language, without selection pressure, in a preprint.

      Model collapse is filed against the claim rather than for it because it
      is the study most likely to be mistaken for support and concerns a
      different mechanism: recursive training, not reuse between calls.

      For prose in a working corpus with an operator in the loop, nothing was
      found either way. "Degrades quickly" has no measurement behind it.

  - id: recursive-training-on-model-output-causes-model-collapse
    title: "Indiscriminate use of model-generated content in training causes irreversible defects in the resulting models, with the tails of the original content distribution disappearing"
    epistemic_kind: observation
    short_name: "model collapse"
    semantic_query: "model collapse recursive training on generated data distribution tails disappear Nature 2024"
    families: [prior-art]
    atoms_for: [ell-156, ell-157]
    body: |
      ## Working notes

      Recorded as its own claim, at the scope its source actually supports, so
      that it is available to a reader without being silently borrowed as
