name: Clarification
description: The text admits two readings, and two careful implementers would build different things.
title: "[clarification] "
labels: ["clarification"]
body:
  - type: markdown
    attributes:
      value: |
        This is **gate 1** of the findings pipeline, and it asks for an
        observation rather than a fix. What you file lands in
        `docs/findings/` as a finding; a second hand then specifies what is
        actually being claimed about the specification, and a third checks
        that claim against the text as it stands. Only a finding verified
        `accurate` becomes a backlog entry. The reasoning is in
        `docs/findings/README.md`.

        Use this template when the text is not wrong so much as undetermined.
        If a rule is wrong or cannot be implemented at all, use the spec bug
        template instead.
  - type: input
    id: requirement
    attributes:
      label: Which requirement, or which section
      description: A requirement id (`ERF-52`, `YAMLB-1`) or a section number. If you cannot name one, that is itself worth saying here.
      placeholder: "ERF-52"
    validations:
      required: true
  - type: textarea
    id: current-text
    attributes:
      label: The current text, quoted
      description: Paste the sentence or sentences you are reporting on, verbatim, so that a later reader can tell what the document said when you read it.
      render: text
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What you observed
      description: |
        The two readings, and which one you took. Say what each one would make
        an implementation do differently, so that the difference is visible in
        behaviour rather than in wording.
    validations:
      required: true
  - type: dropdown
    id: basis
    attributes:
      label: Basis
      description: How this knows what it says. `anticipated` is the weakest basis there is, and saying so is not a mark against the report.
      options:
        - demonstrated (an artifact exists and can be re-run)
        - reported (a careful reader judged it, nothing failed)
        - anticipated (nobody has hit this)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit read
      description: The `spec_version` in the document's frontmatter, or the commit you read.
      placeholder: "0.9.0"
    validations:
      required: false
